    question: 'In events with at least two muons, plot the invariant mass of every unique same-charge muon pair in the opendata:mc20_13TeV.700325.Sh_2211_Zmumu_maxHTpTV2_CVetoBVeto.deriv.DAOD_PHYSLITE.e8351_s3681_r13167_p6026. For avg_entries_per_event, divide the number of pairs by the number of events with at least two muons, including events that contain no same-charge pair.

      '
    validators:
