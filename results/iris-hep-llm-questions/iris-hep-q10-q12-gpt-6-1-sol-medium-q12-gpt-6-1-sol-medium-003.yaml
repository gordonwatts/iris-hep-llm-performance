      for starting suggestions on histogram axis ranges and binning.\\n\"}\n[{\"name\":\"image_gen__imagegen\",\"description\":\"Tools in the image_gen namespace.\\n\\nThe `image_gen.imagegen` tool enables image generation from descriptions and editing of existing images based on specific instructions. Use it when:\\n\\n- The user requests an image based on a scene description, such as a diagram, portrait, comic, meme, or any other visual.\\n- The user wants to modify an attached or previously generated image with specific changes, including adding or removing elements, altering colors, improving quality/resolution, or transforming the style (e.g., cartoon, oil painting).\\n\\nGuidelines:\\n- imagegen needs a few minutes to finish. In code-mode, use the first-line @exec directive to give the initial call 120 seconds and the same yield for any waits that follow. Once it finishes, return the image with generatedImage(result).\\n- Avoid printing the full result or its base64 image data with
      `text()` or `notify()`; print only small metadata when needed.\\n- Set `transparent_background` to true when the request calls for a transparent background, including background removal or a cutout; set it to false otherwise. For edits, preserve existing transparency unless the user asks to change it.\\n- Omit both `referenced_image_paths` and `num_last_images_to_include` when generating a brand new image.\\n- For edits, use `referenced_image_paths` when every target image has a local file path.\\n- If you have not seen a local image yet, use `view_image` to inspect it before editing.\\n- Use `num_last_images_to_include` only when at least one target image has no local file path.\\n- Set `num_last_images_to_include` to the smallest number of recent conversation images that includes every target image, up to 5.\\n- Never provide both `referenced_image_paths` and `num_last_images_to_include`.\\n- If neither mechanism can include every target image, ask the user to attach the missing
      images again.\\n- Directly generate the image without reconfirmation or clarification unless required images must be attached again.\\n- Always use this tool for image editing unless the user explicitly requests otherwise. Do not use the `python` tool for image editing unless specifically instructed.\\n\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { image_gen__imagegen(args: {\\n  num_last_images_to_include?: number | null;\\n  prompt: string;\\n  referenced_image_paths?: Array<string> | null;\\n  // Whether the output should have a transparent background. Defaults to false.\\n  transparent_background?: boolean;\\n}): Promise<unknown>; };\\n```\"},{\"name\":\"mcp__codex_apps__search_service_web_run\",\"description\":\"Tool for accessing the internet.\\n\\n\\n---\\n\\n## Examples of different commands available in this tool\\n\\nExamples of different commands available in this tool:\\n* `system2_search_query`: {\\\"system2_search_query\\\": [{\\\"q\\\": \\\"What is the
      capital of France?\\\"}, {\\\"q\\\": \\\"What is the capital of belgium?\\\"}]}. Searches the internet for a given query (and optionally with a domain or recency filter)\\n* `image_query`: {\\\"image_query\\\":[{\\\"q\\\": \\\"waterfalls\\\"}]}.\\n* `open`: {\\\"open\\\": [{\\\"ref_id\\\": \\\"turn0search0\\\"}, {\\\"ref_id\\\": \\\"https://www.openai.com\\\", \\\"lineno\\\": 120}]}\\n* `click`: {\\\"click\\\": [{\\\"ref_id\\\": \\\"turn0fetch3\\\", \\\"id\\\": 17}]}\\n* `find`: {\\\"find\\\": [{\\\"ref_id\\\": \\\"turn0fetch3\\\", \\\"pattern\\\": \\\"Annie Case\\\"}]}\\n* `screenshot`: {\\\"screenshot\\\": [{\\\"ref_id\\\": \\\"turn1view0\\\", \\\"pageno\\\": 0}, {\\\"ref_id\\\": \\\"turn1view0\\\", \\\"pageno\\\": 3}]}\\n* `time`: {\\\"time\\\":[{\\\"utc_offset\\\":\\\"+03:00\\\"}]}\\n\\n---\\n\\n## Usage hints\\nTo use this tool efficiently:\\n* Use multiple commands and queries in one call to get more results faster; e.g. {\\\"system2_search_query\\\": [{\\\"q\\\": \\\"bitcoin
      news\\\"}], \\\"find\\\": [{\\\"ref_id\\\": \\\"turn0search0\\\", \\\"pattern\\\": \\\"Annie Case\\\"}, {\\\"ref_id\\\": \\\"turn0search1\\\", \\\"pattern\\\": \\\"John Smith\\\"}]}\\n* Use \\\"response_length\\\" to control the number of results returned by this tool, omit it if you intend to pass \\\"short\\\" in\\n* Only write required parameters; do not write empty lists or nulls where they could be omitted.\\n* `system2_search_query` must have length at most 4 in each call. If it has length > 3, response_length must be medium or long\\n* If you find yourself in a situation where you accidentally call the `web_run` tool, it''s best just to send an empty query: {\\\"system2_search_query\\\": [{\\\"q\\\": \\\"\\\"}]}.\\n\\n\\n\\n---\\n\\n## Decision boundary\\n\\nIf the user makes an explicit request to search the internet, find latest information, look up, etc (or to not do so), you must obey their request.\\nWhen you make an assumption, always consider whether it is temporally
      stable; i.e. whether there''s even a small (>10%) chance it has changed. If it is unstable, you must verify with browsing the internet for verification.\\n\\n<situations_where_you_must_browse_the_internet>\\nBelow is a list of scenarios where browsing the internet MUST be used. PAY CLOSE ATTENTION: you MUST browse the internet in these cases. If you''re unsure or on the fence, you MUST bias towards browsing the internet.\\n- The information could have changed recently: for example news; prices; laws; schedules; product specs; sports scores; economic indicators; political/public/company figures (e.g. the question relates to ''the president of country A'' or ''the CEO of company B'', which might change over time); rules; regulations; standards; software libraries that could be updated; exchange rates; recommendations (i.e., recommendations about various topics or things might be informed by what currently exists / is popular / is safe / is unsafe / is in the zeitgeist / etc.); and many
      many many more categories -- again, if you''re on the fence, you …33896 tokens truncated…xact, direct lookup — prefer this when known; it''s faster and unambiguous.\\n\\tlist_title (Optional[str]): The title of the list to read. Resolved via a fuzzy, relevance-ranked search (not an exact, case-sensitive match) — so it can be slower and less precise than list_id, may match several similarly-named lists, and may return a related list rather than an exact title match; the best match is used. Pass list_id to target a specific list among several with similar titles. If nothing matches, returns list_not_found.\\n\\tformat (Optional[str]): Output format - ''markdown'' (default) or ''csv''\\n\\tlimit (Optional[int]): Maximum number of records to return per page. Capped at 100 — larger values are clamped to 100, so reading more than 100 records requires paginating with cursor. Default: 100\\n\\tcursor (Optional[str]): Pagination cursor for fetching the next page of a multi-page read. Pass back
      the exact next_cursor string from a previous call''s output — it is an opaque token, so do not construct, parse, or modify it. Omit (or pass empty) to read from the first record.\\n\\tschema_only (Optional[bool]): When true, return only the column schema (names and types) and skip fetching records. Use this to answer \\\"what columns does this list have?\\\" without reading any rows. Default: false\\n\\nReturns:\\n\\tstr: List contents formatted as a markdown table or CSV data. When more records remain, the output includes a next_cursor to pass back in for the following page.\\n\\nExamples:\\n\\t- \\\"Read a list\\\" -> slack_read_list(list_id=''F0ABC123'')\\n\\t- \\\"Read a list by name\\\" -> slack_read_list(list_title=''Project Tracker'')\\n\\t- \\\"What columns does this list have?\\\" -> slack_read_list(list_id=''F0ABC123'', schema_only=true)\\n\\t- \\\"Export list as CSV\\\" -> slack_read_list(list_id=''F0ABC123'', format=''csv'')\\n\\t- \\\"Get first 10 rows\\\" -> slack_read_list(list_id=''F0ABC123'',
      limit=10)\\n\\t- \\\"Get the next page\\\" -> slack_read_list(list_id=''F0ABC123'', cursor=''<next_cursor from prior call>'')\\n\\nError Handling:\\n\\t- Returns error if neither list_id nor list_title is provided, or the list is not found\\n\\t- Returns error if user lacks access to the list\\n\\t- When list_title matches multiple lists, the best search match is read (no error); pass list_id to disambiguate\\n\\t- Returns \\\"invalid_cursor\\\" if the pagination cursor is malformed\\n\\t- Returns \\\"rate_limit_exceeded\\\" when too many reads are issued in a short window — back off, then retry\\n\\t- Returns \\\"feature_not_enabled\\\" if Slack lists are not available to this account — do not retry\\n\\t- Returns \\\"failure_fetching_records\\\" if the list could be read but came back malformed — retrying once is reasonable; treat a second occurrence as terminal\\n\\t- Other errors from the underlying record read surface as-is, e.g. \\\"missing_scope\\\" (the token lacks lists:read
      — do not retry) or \\\"internal_error\\\". Treat an unfamiliar code as terminal unless it names a rate limit.\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__slack_slack_read_list(args: {\\n  // Pagination cursor returned by a previous call as `next_cursor`. An opaque token — pass it back verbatim; do not construct or modify it. Omit to read from the first record.\\n  cursor?: string;\\n  // Output format: ''markdown'' (default) or ''csv''\\n  format?: \\\"markdown\\\" | \\\"csv\\\";\\n  // Maximum number of records to return. Default: 100\\n  limit?: number;\\n  // Link ID for the account this call should use. Supply link_id using a link_id value below. Select only from the accounts below. If multiple listed accounts could satisfy a write request and the intended account is not clear from the user''s request or conversation, ask which account to use before calling this tool.\\n  // [\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8bf582ee88191a8999a05c1170680\\\",\\n  //
      \\\"link_name\\\": \\\"HEP-Watts (Undergrads)\\\",\\n  // \\\"profile_id\\\": \\\"TB3SPQNQH:UB4DBQEP4\\\",\\n  // \\\"profile_name\\\": \\\"Gordon Watts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"TB3SPQNQH\\\",\\n  // \\\"profile_workspace_name\\\": \\\"HEP-Watts\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8be1b8a908191b09b9a7dcef4f239\\\",\\n  // \\\"link_name\\\": \\\"uw-teaching-team\\\",\\n  // \\\"profile_id\\\": \\\"T011H4V3RC6:U01HY74RW4U\\\",\\n  // \\\"profile_name\\\": \\\"Gordon Watts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"T011H4V3RC6\\\",\\n  // \\\"profile_workspace_name\\\": \\\"uw-phys-teaching-team\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8bdfc3868819199deeb7c48f56213\\\",\\n  // \\\"link_name\\\": \\\"CLARIPHY\\\",\\n  // \\\"profile_id\\\": \\\"T01FEB9RJFQ:U0B8EFYH9JA\\\",\\n  // \\\"profile_name\\\": \\\"gwatts\\\",\\n  //
      \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"T01FEB9RJFQ\\\",\\n  // \\\"profile_workspace_name\\\": \\\"CLARIPHY\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8beafcf508191901f7be18bcf12f2\\\",\\n  // \\\"link_name\\\": \\\"IRIS-HEP\\\",\\n  // \\\"profile_id\\\": \\\"TDFUQQ7UZ:UFG92F7TJ\\\",\\n  // \\\"profile_name\\\": \\\"Gordon Watts (he/him)\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"TDFUQQ7UZ\\\",\\n  // \\\"profile_workspace_name\\\": \\\"iris-hep\\\"\\n  // }\\n  // ]\\n  link_id: string;\\n  // The id of the list\\n  list_id?: string;\\n  // The title of the list\\n  list_title?: string;\\n  // When true, return only the column schema (names and types) without fetching any records. Default: false\\n  schema_only?: boolean;\\n}): Promise<CallToolResult>; };\\n```\"},{\"name\":\"mcp__codex_apps__slack_slack_send_message\",\"description\":\"Share work and pull context\\n\\nSends
      a message to a Slack channel or user. To DM a user, use their user_id as channel_id. Return the message link to the user.\\n\\nMessage uses standard markdown (**bold**, _italic_, `code`, ~~strikethrough~~, >blockquotes, lists, links, code blocks, tables, headers). Limited to 5000 chars per text element. Tables use standard Markdown syntax with `|` as column delimiters. Do NOT escape the structural `|` characters that form the table borders and column separators. Only escape `|` as `\\\\|` when a literal pipe character appears inside a cell value. Code blocks can include a language specifier (e.g. ```python, ```js, ```bash) for syntax highlighting and copy functionality. Do not include sensitive info in link query params. Cannot post to externally shared (Slack Connect) channels.\\n\\nThread replies: set thread_ts to parent message timestamp, reply_broadcast=true to also post to channel.\\n\\nLink previews: when your message contains links from apps installed in the workspace (e.g.
      GitHub, Jira, Figma), set unfurl_app_links=true to enable rich link previews for those URLs.\\n\\nUse slack_search_channels to find channel IDs, slack_search_users to find user IDs.\\nIf user explicitly requests a draft, use slack_send_message_draft instead.\\n\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__slack_slack_send_message(args: {\\n  // Search all channels\\n  channel_id: string;\\n  // ID of the draft to delete after sending\\n  draft_id?: string;\\n  // Link ID for the account this call should use. Supply link_id using a link_id value below. Select only from the accounts below. If multiple listed accounts could satisfy a write request and the intended account is not clear from the user''s request or conversation, ask which account to use before calling this tool.\\n  // [\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8bf582ee88191a8999a05c1170680\\\",\\n  // \\\"link_name\\\": \\\"HEP-Watts (Undergrads)\\\",\\n  // \\\"profile_id\\\": \\\"TB3SPQNQH:UB4DBQEP4\\\",\\n  //
      \\\"profile_name\\\": \\\"Gordon Watts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"TB3SPQNQH\\\",\\n  // \\\"profile_workspace_name\\\": \\\"HEP-Watts\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8be1b8a908191b09b9a7dcef4f239\\\",\\n  // \\\"link_name\\\": \\\"uw-teaching-team\\\",\\n  // \\\"profile_id\\\": \\\"T011H4V3RC6:U01HY74RW4U\\\",\\n  // \\\"profile_name\\\": \\\"Gordon Watts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"T011H4V3RC6\\\",\\n  // \\\"profile_workspace_name\\\": \\\"uw-phys-teaching-team\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8bdfc3868819199deeb7c48f56213\\\",\\n  // \\\"link_name\\\": \\\"CLARIPHY\\\",\\n  // \\\"profile_id\\\": \\\"T01FEB9RJFQ:U0B8EFYH9JA\\\",\\n  // \\\"profile_name\\\": \\\"gwatts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"T01FEB9RJFQ\\\",\\n  //
