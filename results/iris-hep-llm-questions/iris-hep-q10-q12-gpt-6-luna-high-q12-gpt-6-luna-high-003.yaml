      = math.sqrt(px1 * px1 + py1 * py1 + pz1 * pz1 + MUON_MASS_GEV**2)\n    64\t    e2 = math.sqrt(px2 * px2 + py2 * py2 + pz2 * pz2 + MUON_MASS_GEV**2)\n    65\t    mass2 = (e1 + e2) ** 2 - (px1 + px2) ** 2 - (py1 + py2) ** 2 - (pz1 + pz2) ** 2\n    66\t    return math.sqrt(max(mass2, 0.0))\n    67\t\n    68\t\n    69\t@app.command()\n    70\tdef main(\n    71\t    n_files: int = typer.Option(1, \"--n-files\", min=1, help=\"Number of dataset files to process.\"),\n    72\t    output_dir: Path = typer.Option(Path(\".\"), \"--output-dir\", help=\"Directory for plot_<n>.png files.\"),\n    73\t) -> None:\n    74\t    \"\"\"Plot same-charge muon-pair masses and print raw-value metrics.\"\"\"\n    75\t    query = make_query()\n    76\t    delivered = deliver(\n    77\t        ServiceXSpec(\n    78\t            Sample=[\n    79\t                Sample(\n    80\t                    Name=\"same_charge_dimuon\",\n    81\t                    Dataset=dataset.Rucio(DATASET),\n    82\t                    NFiles=n_files,\n    83\t                    Query=query,\n    84\t                )\n    85\t            ]\n    86\t        )\n    87\t    )\n    88\t\n    89\t    event_records
      = to_awk(delivered)[\"same_charge_dimuon\"]\n    90\t    masses: list[float] = []\n    91\t    selected_events = 0\n    92\t    for event in ak.to_list(event_records):\n    93\t        # The query already requires at least two muons. Keep the count here so\n    94\t        # events without any same-charge pair remain in the metric denominator.\n    95\t        selected_events += 1\n    96\t        pts = event[\"mu_pt\"]\n    97\t        etas = event[\"mu_eta\"]\n    98\t        phis = event[\"mu_phi\"]\n    99\t        charges = event[\"mu_charge\"]\n   100\t        for i in range(len(pts)):\n   101\t            for j in range(i + 1, len(pts)):\n   102\t                if charges[i] == charges[j]:\n   103\t                    masses.append(\n   104\t                        invariant_mass(pts[i], etas[i], phis[i], pts[j], etas[j], phis[j])\n   105\t                    )\n   106\t\n   107\t    output_dir.mkdir(parents=True, exist_ok=True)\n   108\t    plot_path = output_dir / \"plot_1.png\"\n   109\t    fig,
      ax = plt.subplots(figsize=(8, 6))\n   110\t    ax.hist(masses, bins=50, range=(0, 200), histtype=\"step\", linewidth=1.8)\n   111\t    ax.set_xlabel(\"Same-charge dimuon invariant mass [GeV]\")\n   112\t    ax.set_ylabel(\"Muon pairs\")\n   113\t    ax.set_title(\"OpenData MC20 same-charge dimuon pairs\")\n   114\t    ax.grid(alpha=0.2)\n   115\t    fig.tight_layout()\n   116\t    fig.savefig(plot_path, dpi=150)\n   117\t    plt.close(fig)\n   118\t\n   119\t    mean = float(np.mean(masses)) if masses else float(\"nan\")\n   120\t    avg_entries_per_event = len(masses) / selected_events if selected_events else float(\"nan\")\n   121\t    print(f\"METRIC: avg_entries_per_event={avg_entries_per_event} mean={mean}\", flush=True)\n   122\t    typer.echo(f\"Saved {plot_path} from {selected_events} events and {len(masses)} pairs.\")\n   123\t\n   124\t\n   125\tif __name__ == \"__main__\":\n   126\t    app()\n"}],"internal_chat_message_metadata_passthrough":{"turn_id":"01a16b16-cd96-7e13-9889-da3cd3fb31d6","create_time":1792798102.4046092}},"metadata":{"client_authored":false,"fallback_token_limit_override":12000}}

