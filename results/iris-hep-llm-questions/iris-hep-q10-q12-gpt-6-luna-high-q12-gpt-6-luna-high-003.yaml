      {"timestamp":"2026-10-23T23:28:22.398Z","ordinal":129,"type":"event_msg","payload":{"type":"item_completed","thread_id":"01a16b16-cc15-7041-b312-3fa85598f231","turn_id":"01a16b16-cd96-7e13-9889-da3cd3fb31d6","item":{"type":"CommandExecution","id":"exec-54edcdaf-7516-4e2d-8cbc-c21aaedd2f7f","process_id":"35977","command":["/bin/bash","-lc","ls -lh script.py plot_1.png && file plot_1.png && nl -ba script.py | sed -n ''1,180p''"],"cwd":"file:///home/gwatts/llms-test/test-wsl2-llm-rBf6uvhr/workspace","parsed_cmd":[{"type":"unknown","cmd":"ls -lh script.py plot_1.png && file plot_1.png && nl -ba script.py | sed -n ''1,180p''"}],"source":"unified_exec_startup","status":"completed","aggregated_output":"-rw-r--r-- 1 gwatts gwatts  38K Oct 23 16:28 plot_1.png\n-rwxr-xr-x 1 gwatts gwatts 4.3K Oct 23 16:27 script.py\nplot_1.png: PNG image data, 1200 x 900, 8-bit/color RGBA, non-interlaced\n     1\t#!/usr/bin/env -S uv run --script\n     2\t# /// script\n     3\t# requires-python = \">=3.13\"\n     4\t#
      dependencies = [\n     5\t#   \"awkward>=2.6\",\n     6\t#   \"func_adl_servicex_xaodr25\",\n     7\t#   \"hep-llm-helpers>=1.0.0b1\",\n     8\t#   \"jinja2\",\n     9\t#   \"matplotlib\",\n    10\t#   \"numpy\",\n    11\t#   \"servicex\",\n    12\t#   \"servicex-analysis-utils\",\n    13\t#   \"typer>=0.12\",\n    14\t# ]\n    15\t# ///\n    16\t\"\"\"Plot same-charge dimuon invariant masses from one or more OpenData files.\"\"\"\n    17\t\n    18\tfrom __future__ import annotations\n    19\t\n    20\timport math\n    21\tfrom pathlib import Path\n    22\t\n    23\timport awkward as ak\n    24\timport matplotlib.pyplot as plt\n    25\timport numpy as np\n    26\timport typer\n    27\tfrom func_adl_servicex_xaodr25 import FuncADLQueryPHYSLITE\n    28\tfrom servicex import Sample, ServiceXSpec, dataset, deliver\n    29\tfrom servicex_analysis_utils import to_awk\n    30\t\n    31\tapp = typer.Typer(add_completion=False)\n    32\t\n    33\tDATASET = (\n    34\t    \"opendata:mc20_13TeV.700325.Sh_2211_Zmumu_maxHTpTV2_CVetoBVeto.\"\n    35\t    \"deriv.DAOD_PHYSLITE.e8351_s3681_r13167_p6026\"\n    36\t)\n    37\tMUON_MASS_GEV
      = 0.1056583755\n    38\t\n    39\t\n    40\tdef make_query():\n    41\t    base_query = FuncADLQueryPHYSLITE()\n    42\t    return (\n    43\t        base_query\n    44\t        .Where(lambda event: event.Muons().Count() >= 2)\n    45\t        .Select(lambda event: {\"muons\": event.Muons()})\n    46\t        .Select(\n    47\t            lambda collections: {\n    48\t                \"mu_pt\": collections.muons.Select(lambda mu: mu.pt() / 1000.0),\n    49\t                \"mu_eta\": collections.muons.Select(lambda mu: mu.eta()),\n    50\t                \"mu_phi\": collections.muons.Select(lambda mu: mu.phi()),\n    51\t                \"mu_charge\": collections.muons.Select(lambda mu: mu.charge()),\n    52\t            }\n    53\t        )\n    54\t    )\n    55\t\n    56\t\n    57\tdef invariant_mass(pt1: float, eta1: float, phi1: float,\n    58\t                   pt2: float, eta2: float, phi2: float) -> float:\n    59\t    \"\"\"Return the dimuon invariant mass in GeV, using
      the muon rest mass.\"\"\"\n    60\t    px1, py1 = pt1 * math.cos(phi1), pt1 * math.sin(phi1)\n    61\t    px2, py2 = pt2 * math.cos(phi2), pt2 * math.sin(phi2)\n    62\t    pz1, pz2 = pt1 * math.sinh(eta1), pt2 * math.sinh(eta2)\n    63\t    e1 = math.sqrt(px1 * px1 + py1 * py1 + pz1 * pz1 + MUON_MASS_GEV**2)\n    64\t    e2 = math.sqrt(px2 * px2 + py2 * py2 + pz2 * pz2 + MUON_MASS_GEV**2)\n    65\t    mass2 = (e1 + e2) ** 2 - (px1 + px2) ** 2 - (py1 + py2) ** 2 - (pz1 + pz2) ** 2\n    66\t    return math.sqrt(max(mass2, 0.0))\n    67\t\n    68\t\n    69\t@app.command()\n    70\tdef main(\n    71\t    n_files: int = typer.Option(1, \"--n-files\", min=1, help=\"Number of dataset files to process.\"),\n    72\t    output_dir: Path = typer.Option(Path(\".\"), \"--output-dir\", help=\"Directory for plot_<n>.png files.\"),\n    73\t) -> None:\n    74\t    \"\"\"Plot same-charge muon-pair masses and print raw-value metrics.\"\"\"\n    75\t    query = make_query()\n    76\t    delivered =
      deliver(\n    77\t        ServiceXSpec(\n    78\t            Sample=[\n    79\t                Sample(\n    80\t                    Name=\"same_charge_dimuon\",\n    81\t                    Dataset=dataset.Rucio(DATASET),\n    82\t                    NFiles=n_files,\n    83\t                    Query=query,\n    84\t                )\n    85\t            ]\n    86\t        )\n    87\t    )\n    88\t\n    89\t    event_records = to_awk(delivered)[\"same_charge_dimuon\"]\n    90\t    masses: list[float] = []\n    91\t    selected_events = 0\n    92\t    for event in ak.to_list(event_records):\n    93\t        # The query already requires at least two muons. Keep the count here so\n    94\t        # events without any same-charge pair remain in the metric denominator.\n    95\t        selected_events += 1\n    96\t        pts = event[\"mu_pt\"]\n    97\t        etas = event[\"mu_eta\"]\n    98\t        phis = event[\"mu_phi\"]\n    99\t        charges = event[\"mu_charge\"]\n   100\t        for
      i in range(len(pts)):\n   101\t            for j in range(i + 1, len(pts)):\n   102\t                if charges[i] == charges[j]:\n   103\t                    masses.append(\n   104\t                        invariant_mass(pts[i], etas[i], phis[i], pts[j], etas[j], phis[j])\n   105\t                    )\n   106\t\n   107\t    output_dir.mkdir(parents=True, exist_ok=True)\n   108\t    plot_path = output_dir / \"plot_1.png\"\n   109\t    fig, ax = plt.subplots(figsize=(8, 6))\n   110\t    ax.hist(masses, bins=50, range=(0, 200), histtype=\"step\", linewidth=1.8)\n   111\t    ax.set_xlabel(\"Same-charge dimuon invariant mass [GeV]\")\n   112\t    ax.set_ylabel(\"Muon pairs\")\n   113\t    ax.set_title(\"OpenData MC20 same-charge dimuon pairs\")\n   114\t    ax.grid(alpha=0.2)\n   115\t    fig.tight_layout()\n   116\t    fig.savefig(plot_path, dpi=150)\n   117\t    plt.close(fig)\n   118\t\n   119\t    mean = float(np.mean(masses)) if masses else float(\"nan\")\n   120\t    avg_entries_per_event
      = len(masses) / selected_events if selected_events else float(\"nan\")\n   121\t    print(f\"METRIC: avg_entries_per_event={avg_entries_per_event} mean={mean}\", flush=True)\n   122\t    typer.echo(f\"Saved {plot_path} from {selected_events} events and {len(masses)} pairs.\")\n   123\t\n   124\t\n   125\tif __name__ == \"__main__\":\n   126\t    app()\n","exit_code":0,"duration":{"secs":0,"nanos":4453}},"started_at_ms":1792798102398,"completed_at_ms":1792798102398}}

