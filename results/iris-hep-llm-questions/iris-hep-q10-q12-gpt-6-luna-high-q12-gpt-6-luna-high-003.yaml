      {"timestamp":"2026-10-23T23:27:05.354Z","ordinal":24,"type":"response_item","payload":{"type":"custom_tool_call_output","id":"ctco_01a16b16-e68a-7542-a905-05d46dbd2709","call_id":"call_11b0e2c199bd4db98e96f766dc9d1577","output":[{"type":"input_text","text":"Script completed\nWall time 0.1 seconds\nOutput:\n"},{"type":"input_text","text":"---\nname: servicex\ndescription: Write and debug ServiceX queries in func_adl against ATLAS xAOD data (PHYSLITE/PHYS), including dataset selection, filtering, hosted delivery, and local WSL2 reproduction of failing transforms. Use when asked to build, edit, or debug ServiceX/func_adl queries, ATLAS xAOD skims, rucio dataset fetches, or ServiceX Local runs.\n---\n\n# ServiceX\n\n## Overview\n\nProvide concise, correct func_adl query patterns for ServiceX on ATLAS xAOD, with best practices for selections, outputs, and deliver usage.\n\n## Workflow\n\n1. Identify the dataset type and base query.\n   - Use `FuncADLQueryPHYSLITE` for PHYSLITE or OpenData.\n   -
      Use `FuncADLQueryPHYS` for PHYS or other derivations.\n   - For an unfamiliar object property or missing method, follow\n     `references/datamodel-xaod-discovery.md`: inspect the installed release-matched\n     Python stubs first, then the corresponding Athena headers if needed.\n2. Build a top-level `Select` that gathers all required collections and singletons.\n   - Apply object-level filters with nested `.Where` inside this `Select`.\n   - Do not pick columns yet.\n3. Apply event-level filtering with a top-level `.Where` after the collections `Select`.\n4. Create a final top-level `Select` that returns a single dictionary of output columns.\n   - Convert units to standard LHC units (GeV, meters, etc.).\n   - Never return a nested dictionary.\n5. Use `deliver` once with `NFiles=1` by default and appropriate dataset source(s).\n6. Make sure that the layout of the data that will be returned is remembered - downstream tasks that want to work with the data will need to understand it.\n\n##
      Core Rules\n\n- Prefer two top-level `Select` calls: collections first, output columns second.\n- Filter objects with nested `.Where`; filter events with a top-level `.Where`.\n- Use a single final `Select` that returns a dictionary of outputs.\n- Do not use `awkward` functions inside ServiceX queries.\n- Use `dataset.Rucio` for rucio DIDs and `dataset.FileList` for URL lists.\n- Always set `NFiles=1` by default.\n- For fetches where cache bypass matters, use `ignore_local_cache=True` in `deliver`.\n- If a hosted transform fails and its worker logs are required, respond with\n  `HELP USER`; for a local WSL2 run, inspect the generated `wsl_log.txt` as\n  described in `references/servicex-local-wsl2.md`.\n- Ensure `func_adl_servicex_xaodr25` is listed as a dependency in the active project and installed in the current virtual environment before running or generating code that uses it.\n- The suffix on the xAOD package selects the ATLAS software release: `func_adl_servicex_xaodr25` is
      for Release 25 and `func_adl_servicex_xaodr21` is for Release 21. Match the query package to the ServiceX xAOD backend/executor release; do not mix an r25 query package with an r21 executor.\n- When using xAOD tool helpers, add `hep-llm-helpers>=1.0.0b1` to the active project; standalone PEP 723 scripts must list it in their dependency block, and imports use `hep_llm_helpers.xaod_hints`.\n- When defining an xAOD accessor, the Python variable assigned by `make_tool_accessor` must exactly match its `function_name` (for example, `tag_weight = make_tool_accessor(..., function_name=\"tag_weight\", ...)`); use that same name in the later query. A mismatch causes an unknown-type translation error.\n- In standalone-script metadata, declare `jinja2` explicitly if the environment requires it for `func_adl_servicex_xaodr25` usage.\n- When a hosted xAOD transform fails and its worker log is unavailable, use the\n  local WSL2 procedure in `references/servicex-local-wsl2.md` before changing\n  the
      query. Keep its generated code, logs, caches, downloaded files, and\n  outputs outside the repository.\n\n## References\n\n- Load `references/servicex-hints.md` for overall ServiceX query patterns, synchronous delivery patterns, best practices, and error handling.\n- Load `references/servicex-async-hints.md` only when async behavior is explicitly requested (`deliver_async`, async timeout handling, or version-compat async behavior).\n- Load `references/servicex-local-wsl2.md` when reproducing a failing ATLAS\n  PHYSLITE transform locally on Windows with `servicex-local` and WSL2.\n- Load only the relevant xAOD data model topic file(s) to keep context small. Naming convention: `references/datamodel-xaod-*.md`.\n- Load [xAOD accessor discovery](references/datamodel-xaod-discovery.md) for\n  unfamiliar quantities, enum arguments, auxiliary attributes, or C++ methods\n  absent from the Python stubs. It includes a small C++ callable pattern.\n- xAOD topics:\n  - `references/datamodel-xaod-units.md`
      (standard ATLAS units (energy, etc))\n  - `references/datamodel-xaod-objects.md` (jets, electrons, muons)\n  - `references/datamodel-xaod-tau.md`\n  - `references/datamodel-xaod-missing-et.md`\n  - `references/datamodel-xaod-tools-btagging.md`\n  - `references/datamodel-xaod-triggers.md` (event decisions and a matching-format decision table; start here for trigger queries)\n  - `references/datamodel-xaod-event-weights.md`\n  - `references/datamodel-xaod-tlorentzvector.md`\n\nFor triggers, load only the recipe needed after choosing the operation:\n\n- Fired chain names: [name discovery](references/datamodel-xaod-trigger-names.md).\n- Precomputed `TrigMatch_` / `AnalysisTrigMatch_` composites: [Run 2 matching](references/datamodel-xaod-trigger-matching-run2.md).\n- `HLTNav_Summary_*` navigation: [Run 3 matching](references/datamodel-xaod-trigger-matching-run3.md).\n- Data-trigger recommendations, GRLs, or prescales: [trigger selection](references/datamodel-xaod-trigger-selection.md).\n"},{"type":"input_text","text":"#!/usr/bin/env
      -S uv run --script\n# NOTE: Be careful editing this block; requires-python and dependencies control uv/PEP 723 execution.\n# /// script\n# requires-python = \">=3.13\"\n# dependencies = [\n#   \"typer>=0.12\",\n# ]\n# ///\nimport logging\n\nimport typer\n\napp = typer.Typer(add_completion=False)\n\n\n@app.command()\ndef main(verbose: int = typer.Option(0, \"-v\", \"--verbose\", count=True)) -> None:\n    \"\"\"Describe what the script does.\"\"\"\n    log_level = logging.WARNING\n    if verbose == 1:\n        log_level = logging.INFO\n    elif verbose >= 2:\n        log_level = logging.DEBUG\n    logging.basicConfig(level=log_level, format=\"%(levelname)s: %(message)s\")\n    typer.echo(\"Hello from Typer.\")\n\n\nif __name__ == \"__main__\":\n    app()\n"},{"type":"input_text","text":"[{\"name\":\"mcp__codex_apps__search_service_web_run\",\"description\":\"Tool for accessing the internet.\\n\\n\\n---\\n\\n## Examples of different commands available in this tool\\n\\nExamples of different
      commands available in this tool:\\n* `system2_search_query`: {\\\"system2_search_query\\\": [{\\\"q\\\": \\\"What is the capital of France?\\\"}, {\\\"q\\\": \\\"What is the capital of belgium?\\\"}]}. Searches the internet for a given query (and optionally with a domain or recency filter)\\n* `image_query`: {\\\"image_query\\\":[{\\\"q\\\": \\\"waterfalls\\\"}]}.\\n* `open`: {\\\"open\\\": [{\\\"ref_id\\\": \\\"turn0search0\\\"}, {\\\"ref_id\\\": \\\"https://www.openai.com\\\", \\\"lineno\\\": 120}]}\\n* `click`: {\\\"click\\\": [{\\\"ref_id\\\": \\\"turn0fetch3\\\", \\\"id\\\": 17}]}\\n* `find`: {\\\"find\\\": [{\\\"ref_id\\\": \\\"turn0fetch3\\\", \\\"pattern\\\": \\\"Annie Case\\\"}]}\\n* `screenshot`: {\\\"screenshot\\\": [{\\\"ref_id\\\": \\\"turn1view0\\\", \\\"pageno\\\": 0}, {\\\"ref_id\\\": \\\"turn1view0\\\", \\\"pageno\\\": 3}]}\\n* `time`: {\\\"time\\\":[{\\\"utc_offset\\\":\\\"+03:00\\\"}]}\\n\\n---\\n\\n## Usage hints\\nTo use this tool efficiently:\\n* Use multiple
      commands and queries in one call to get more results faster; e.g. {\\\"system2_search_query\\\": [{\\\"q\\\": \\\"bitcoin news\\\"}], \\\"find\\\": [{\\\"ref_id\\\": \\\"turn0search0\\\", \\\"pattern\\\": \\\"Annie Case\\\"}, {\\\"ref_id\\\": \\\"turn0search1\\\", \\\"pattern\\\": \\\"John Smith\\\"}]}\\n* Use \\\"response_length\\\" to control the number of results returned by this tool, omit it if you intend to pass \\\"short\\\" in\\n* Only write required parameters; do not write empty lists or nulls where they could be omitted.\\n* `system2_search_query` must have length at most 4 in each call. If it has length > 3, response_length must be medium or long\\n* If you find yourself in a situation where you accidentally call the `web_run` tool, it''s best just to send an empty query: {\\\"system2_search_query\\\": [{\\\"q\\\": \\\"\\\"}]}.\\n\\n\\n\\n---\\n\\n## Decision boundary\\n\\nIf the user makes an explicit request to search the internet, find latest information, look up, etc
      (or to not do so), you must obey their request.\\nWhen you make an assumption, always consider whether it is temporally stable; i.e. whether there''s even a small (>10%) chance it has changed. If it is unstable, you must verify with browsing the internet for verification.\\n\\n<situations_where_you_must_browse_the_internet>\\nBelow is a list of scenarios where browsing the internet MUST be used. PAY CLOSE ATTENTION: you MUST browse the internet in these cases. If you''re unsure or on the fence, you MUST bias towards browsing the internet.\\n- The information could have changed recently: for example news; prices; laws; schedules; product specs; sports scores; economic indicators; political/public/company figures (e.g. the question relates to ''the president of country A'' or ''the CEO of company B'', which might change over time); rules; regulations; standards; software libraries that could be updated; exchange rates; recommendations (i.e., recommendations about various topics or things
      might be informed by what currently exists / is popular / is safe / is unsafe / is in the zeitgeist / etc.); and many many many more categories -- again, if you''re on the fence, you MUST browse the internet!\\n  - For news queries, prioritize more recent events, ensuring you compare publish dates and the date that the event happened.\\n- The user is seeking recommendations that could lead them to spend substantial time or money -- researching products, restaurants, travel plans, etc.\\n- The user wants (or would benefit from) direct quotes, links, or precise source attribution.\\n- A specific page, paper, dataset, PDF, or site is referenced and you haven''t been given its contents.\\n- You''re unsure about a fact, the topic is niche or emerging, or you suspect there''s at least a 10% chance you will incorrectly recall it\\n- High-stakes accuracy matters (medical, legal, financial guidance). For these you generally should search by default because this information is highly temporally
      unstable\\n- The user explicitly says to search, browse, verify, or look it up.\\n</situations_where_you_must_browse_the_internet>\\n\\n---\\n\\n## Citations\\n\\nResults include internal reference IDs such as `turn0search0` and `turn1view0`.\\nUse those reference IDs only in calls to this tool; do not expose them in the\\nfinal response.\\n\\nCite sources in the final response using Markdown links:\\n\\n- Cite a single source as `[descriptive source title](https://example.com/page)`.\\n- Cite multiple sources with separate Markdown links, for example\\n  `[first source](https://example.com/one), [second source](https://example.com/two)`.\\n- Link directly to the page that supports the claim. Do not link to search result\\n  pages or use bare URLs.\\n\\nFormatting of citations:\\n\\n- Place each citation as near as possible to the claim it supports, normally at\\n  the end of the sentence or paragraph and after punctuation.\\n- Do not place citations inside code fences.\\n- Do not
      put citations on a line by themselves or collect all citations at the\\n  end of the response.\\n\\nIf you browse the internet, cite statements supported by web sources. Each cited\\nsource must directly support the associated claim. Prefer primary and\\nauthoritative sources, and use sources from different domains when the response\\nbenefits from multiple perspectives.\\n\\n---\\n\\n## Special cases\\nIf these conflict with any other instructions, these should take precedence.\\n\\n<special_cases>\\n- When the user asks for information about how to use OpenAI products, (ChatGPT, the OpenAI API, etc.), you should check the code in local env and only browse as fallback, when you browse restrict your sources to official OpenAI websites using the domains filter, unless otherwise requested.\\n- When using search to answer technical questions, you must only rely on primary sources (research papers, official documentation, etc.)\\n- Clearly indicate when you are making an inference from
      sources.\\n</special_cases>\\n\\n---\\n\\n## Word limits\\nResponses may not excessively quote or draw on a specific source. There are several limits here:\\n- **Limit on verbatim quotes:**\\n  - You may not quote more than 25 words verbatim from any single non-lyrical source, unless the source is reddit.\\n  - For song lyrics, verbatim quotes must be limited to at most 10 words.\\n  - Long quotes from reddit are allowed, as long as you indicate that those are direct quotes via a markdown blockquote starting with \\\">\\\", copy verbatim, and cite the source.\\n- **Word limits:**\\n  - Each webpage source in the sources has a word limit label formatted like \\\"[wordlim N]\\\", in which N is the maximum number of words in the whole response that are attributed to that source. If omitted, the word limit is 200 words.\\n  - Non-contiguous words derived from a given source must be counted to the word limit.\\n  - The summarization limit N is a maximum for each source.\\n  - When using
      multiple sources, their summarization limits add together. However, each article used must be relevant to the response.\\n- **Copyright compliance:**\\n  - You must avoid providing full articles, long verbatim passages, or extensive direct quotes due to copyright concerns.\\n  - If the user asked for a verbatim quote, the response should provide a short compliant excerpt and then answer with paraphrases and summaries.\\n  - Again, this limit does not apply to reddit content, as long as it''s appropriately indicated that those are direct quotes and you cite the source.\\n\\nRun the web commands documented in this namespace.\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__search_service_web_run(args: {\\n  // Open the link `id` from the page indicated by `ref_id`.\\n  // Valid link ids are displayed with the formatting: `【{id}†.*】`.\\n  click?: Array<{ id: number; ref_id: string; }> | null;\\n  // Find the text `pattern` in the page indicated by `ref_id`.\\n  find?:
      Array<{ pattern: string; ref_id: string; }> | null;\\n  // query image search engine for a given list of queries\\n  image_query?: Array<{\\n  // whether to filter by a specific list of domains\\n  domains?: Array<string> | null;\\n  // search query\\n  q: string;\\n  // whether to filter by recency (response would be within this number of recent days)\\n  recency?: number | null;\\n}> | null;\\n  // Open the page indicated by `ref_id` and position viewport at the line number `lineno`.\\n  // In addition to reference ids (like \\\"turn0search1\\\"), you can also use the fully qualified URL.\\n  // If `lineno` is not provided, the viewport will be positioned at the beginning of the document or centered on\\n  // the most relevant passage, if available.\\n  // You can use this to scroll to a new location of previously opened pages.\\n  open?: Array<{ lineno?: number | null; ref_id: string; }> | null;\\n  // the length of the response to be returned\\n  response_length?: \\\"short\\\"
      | \\\"medium\\\" | \\\"long\\\";\\n  // Take a screenshot of the page `pageno` indicated by `ref_id`. Currently only works on pdfs.\\n  // `pageno` is 0-indexed and can be at most the number of pdf pages -1.\\n  screenshot?: Array<{ pageno: number; ref_id: string; }> | null;\\n  // query internet search engine for a given list of queries\\n  system2_search_query?: Array<{\\n  // whether to filter by a specific list of domains\\n  domains?: Array<string> | null;\\n  // search query\\n  q: string;\\n  // whether to filter by recency (response would be within this number of recent days)\\n  recency?: number | null;\\n}> | null;\\n  // get time for the given list of UTC offsets\\n  time?: Array<{\\n  // UTC offset formatted like ''+03:00''\\n  utc_offset: string;\\n}> | null;\\n}): Promise<CallToolResult>; };\\n```\"},{\"name\":\"web__run\",\"description\":\"Tools in the web namespace.\\n\\nTool for accessing the internet.\\n\\n\\n---\\n\\n## Examples of different commands available in
      this tool\\n\\nExamples of different commands available in this tool:\\n* `search_query`: {\\\"search_query\\\": [{\\\"q\\\": \\\"What is the capital of France?\\\"}, {\\\"q\\\": \\\"What is the capital of belgium?\\\"}]}. Searches the internet for a given query (and optionally with a domain or recency filter)\\n* `image_query`: {\\\"image_query\\\":[{\\\"q\\\": \\\"waterfalls\\\"}]}.\\n* `open`: {\\\"open\\\": [{\\\"ref_id\\\": \\\"turn0search0\\\"}, {\\\"ref_id\\\": \\\"https://www.openai.com\\\", \\\"lineno\\\": 120}]}\\n* `click`: {\\\"click\\\": [{\\\"ref_id\\\": \\\"turn0fetch3\\\", \\\"id\\\": 17}]}\\n* `find`: {\\\"find\\\": [{\\\"ref_id\\\": \\\"turn0fetch3\\\", \\\"pattern\\\": \\\"Annie Case\\\"}]}\\n* `screenshot`: {\\\"screenshot\\\": [{\\\"ref_id\\\": \\\"turn1view0\\\", \\\"pageno\\\": 0}, {\\\"ref_id\\\": \\\"turn1view0\\\", \\\"pageno\\\": 3}]}\\n* `finance`: {\\\"finance\\\":[{\\\"ticker\\\":\\\"AMD\\\",\\\"type\\\":\\\"equity\\\",\\\"market\\\":\\\"USA\\\"}]}, {\\\"finance\\\":[{\\\"ticker\\\":\\\"BTC\\\",\\\"type\\\":\\\"crypto\\\",\\\"market\\\":\\\"\\\"}]}\\n*
      `weather`: {\\\"weather\\\":[{\\\"location\\\":\\\"San Francisco, CA\\\"}]}\\n* `sports`: {\\\"sports\\\":[{\\\"fn\\\":\\\"standings\\\",\\\"league\\\":\\\"nfl\\\"}, {\\\"fn\\\":\\\"schedule\\\",\\\"league\\\":\\\"nba\\\",\\\"team\\\":\\\"GSW\\\",\\\"date_from\\\":\\\"2025-02-24\\\"}]}\\n* `time`: {\\\"time\\\":[{\\\"utc_offset\\\":\\\"+03:00\\\"}]}\\n\\n---\\n\\n## Usage hints\\nTo use this tool efficiently:\\n* Use multiple commands and queries in one call to get more results faster; e.g. {\\\"search_query\\\": [{\\\"q\\\": \\\"bitcoin news\\\"}], \\\"finance\\\":[{\\\"ticker\\\":\\\"BTC\\\",\\\"type\\\":\\\"crypto\\\",\\\"market\\\":\\\"\\\"}], \\\"find\\\": [{\\\"ref_id\\\": \\\"turn0search0\\\", \\\"pattern\\\": \\\"Annie Case\\\"}, {\\\"ref_id\\\": \\\"turn0search1\\\", \\\"pattern\\\": \\\"John Smith\\\"}]}\\n* Use \\\"response_length\\\" to control the number of results returned by this tool, omit it if you intend to pass \\\"short\\\" in\\n* Only write required parameters;
      do not write empty lists or nulls where they could be omitted.\\n* `search_query` must have length at most 4 in each call. If it has length > 3, response_length must be medium or long\\n* If you find yourself in a situation where you accidentally call the `web.run` tool, it''s best just to send an empty query: {\\\"search_query\\\": [{\\\"q\\\": \\\"\\\"}]}.\\n\\n---\\n\\n## Decision boundary\\n\\nIf the user makes an explicit request to search the internet, find latest information, look up, etc (or to not do so), you must obey their request.\\nWhen you make an assumption, always consider whether it is temporally stable; i.e. whether there''s even a small (>10%) chance it has changed. If it is unstable, you must verify with browsing the internet for verification.\\n\\n<situations_where_you_must_browse_the_internet>\\nBelow is a list of scenarios where browsing the internet MUST be used. PAY CLOSE ATTENTION: you MUST browse the internet in these cases. If you''re unsure or on the fence,
      you MUST bias towards browsing the internet.\\n- The information could have changed recently: for example news; prices; laws; schedules; product specs; sports scores; economic indicators; political/public/company figures (e.g. the question relates to ''the president of country A'' or ''the CEO of company B'', which might change over time); rules; regulations; standards; software libraries that could be updated; exchange rates; recommendations (i.e., recommendations about various topics or things might be informed by what currently exists / is popular / is safe / is unsafe / is in the zeitgeist / etc.); and many many many more categories -- again, if you''re on the fence, you MUST browse the internet!\\n  - For news queries, prioritize more recent events, ensuring you compare publish dates and the date that the event happened.\\n- The user is seeking recommendations that could lead them to spend substantial time or money -- researching products, restaurants, travel plans, etc.\\n- The
      user wants (or would benefit from) direct quotes, links, or precise source attribution.\\n- A specific page, paper, dataset, PDF, or site is referenced and you haven''t been given its contents.\\n- You''re unsure about a fact, the topic is niche or emerging, or you suspect there''s at least a 10% chance you will incorrectly recall it\\n- High-stakes accuracy matters (medical, legal, financial guidance). For these you generally should search by default because this information is highly temporally unstable\\n- The user explicitly says to search, browse, verify, or look it up.\\n</situations_where_you_must_browse_the_internet>\\n\\n---\\n\\n## Citations\\n\\nResults from `web.run` include internal reference IDs such as `turn2search5`. Use\\nthose reference IDs only in calls to `web.run`; do not expose them in the final\\nresponse.\\n\\nCite sources in the final response using Markdown links:\\n\\n- Cite a single source as `[descriptive source title](https://example.com/page)`.\\n- Cite
      multiple sources with separate Markdown links, for example\\n  `[first source](https://example.com/one), [second source](https://example.com/two)`.\\n- Link directly to the page that supports the claim. Do not link to search result\\n  pages or use bare URLs.\\n\\nFormatting of citations:\\n\\n- Place each citation as near as possible to the claim it supports, normally at\\n  the end of the sentence or paragraph and after punctuation.\\n- Do not place citations inside code fences.\\n- Do not put citations on a line by themselves or collect all citations at the\\n  end of the response.\\n\\nIf you browse the internet, cite statements supported by web sources. Each cited\\nsource must directly support the associated claim. Prefer primary and\\nauthoritative sources, and use sources from different domains when the response\\nbenefits from multiple perspectives.\\n\\n---\\n\\n## Special cases\\nIf these conflict with any other instructions, these should take precedence.\\n\\n<special_cases>\\n-
      When the user asks for information about how to use OpenAI products, (ChatGPT, the OpenAI API, etc.), you should check the code in local env and only browse as fallback, when you browse restrict your sources to official OpenAI websites using the domains filter, unless otherwise requested.\\n- When using search to answer technical questions, you must only rely on primary sources (research papers, official documentation, etc.)\\n- Clearly indicate when you are making an inference from sources.\\n</special_cases>\\n\\n---\\n\\n## Word limits\\nResponses may not excessively quote or draw on a specific source. There are several limits here:\\n- **Limit on verbatim quotes:**\\n  - You may not quote more than 25 words verbatim from any single non-lyrical source, unless the source is reddit.\\n  - For song lyrics, verbatim quotes must be limited to at most 10 words.\\n  - Long quotes from reddit are allowed, as long as you indicate that those are direct quotes via a markdown blockquote starting
      with \\\">\\\", copy verbatim, and link the source.\\n- **Word limits:**\\n  - Each webpage source in the sources has a word limit label formatted like \\\"[wordlim N]\\\", in which N is the maximum number of words in the whole response that are attributed to that source. If omitted, the word limit is 200 words.\\n  - Non-contiguous words derived from a given source must be counted to the word limit.\\n  - The summarization limit N is a maximum for each source.\\n  - When using multiple sources, their summarization limits add together. However, each article used must be relevant to the response.\\n- **Copyright compliance:**\\n  - You must avoid providing full articles, long verbatim passages, or extensive direct quotes due to copyright concerns.\\n  - If the user asked for a verbatim quote, the response should provide a short compliant excerpt and then answer with paraphrases and summaries.\\n  - Again, this limit does not apply to reddit content, as long as it''s appropriately indicated
      that those are direct quotes and you link to the source.\\n\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { web__run(args: {\\n  // Open links from previously opened pages.\\n  click?: Array<{\\n  // Numbered link id to open.\\n  id: number;\\n  // Reference id containing the numbered link.\\n  ref_id: string;\\n}>;\\n  // Look up prices for the given stock symbols.\\n  finance?: Array<{\\n  // ISO 3166-1 alpha-3 country code, \\\"OTC\\\", or \\\"\\\" for cryptocurrency.\\n  market?: string;\\n  // Ticker symbol to look up.\\n  ticker: string;\\n  // Asset type to look up.\\n  type: \\\"equity\\\" | \\\"fund\\\" | \\\"crypto\\\" | \\\"index\\\";\\n}>;\\n  // Find text patterns in pages.\\n  find?: Array<{\\n  // Text pattern to find.\\n  pattern: string;\\n  // Reference id or URL to search within.\\n  ref_id: string;\\n}>;\\n  // Query the image search engine for a given list of queries.\\n  image_query?: Array<{\\n  // Whether to filter by a specific list of domains.\\n  domains?:
      Array<string>;\\n  // Search query.\\n  q: string;\\n  // Whether to filter by recency, as a number of recent days.\\n  recency?: number;\\n}>;\\n  // Open pages by reference id or URL.\\n  open?: Array<{\\n  // Line number to position the page at.\\n  lineno?: number;\\n  // Reference id or URL to open.\\n  ref_id: string;\\n}>;\\n  // Set the length of the response to be returned.\\n  response_length?: \\\"short\\\" | \\\"medium\\\" | \\\"long\\\";\\n  // Take screenshots of PDF pages.\\n  screenshot?: Array<{\\n  // Zero-indexed PDF page number.\\n  pageno: number;\\n  // Reference id or URL to screenshot.\\n  ref_id: string;\\n}>;\\n  // Query the internet search engine for a given list of queries.\\n  search_query?: Array<{\\n  // Whether to filter by a specific list of domains.\\n  domains?: Array<string>;\\n  // Search query.\\n  q: string;\\n  // Whether to filter by recency, as a number of recent days.\\n  recency?: number;\\n}>;\\n  // Look up sports schedules and standings.\\n  sports?:
      Array<{\\n  // Start date in YYYY-MM-DD format.\\n  date_from?: string;\\n  // End date in YYYY-MM-DD format.\\n  date_to?: string;\\n  // Sports function to call.\\n  fn: \\\"schedule\\\" | \\\"standings\\\";\\n  // League to look up.\\n  league: \\\"nba\\\" | \\\"wnba\\\" | \\\"nfl\\\" | \\\"nhl\\\" | \\\"mlb\\\" | \\\"epl\\\" | \\\"ncaamb\\\" | \\\"ncaawb\\\" | \\\"ipl\\\";\\n  // Locale for the lookup.\\n  locale?: string;\\n  // Number of games to return.\\n  num_games?: number;\\n  // Opponent to use with `team` when narrowing the lookup.\\n  opponent?: string;\\n  // Team to look up, using the common 3 or 4 letter alias used in broadcasts.\\n  team?: string;\\n  // Tool name for sports requests.\\n  tool?: \\\"sports\\\";\\n}>;\\n  // Get time for the given UTC offsets.\\n  time?: Array<{\\n  // UTC offset formatted like \\\"+03:00\\\".\\n  utc_offset: string;\\n}>;\\n  // Look up weather forecasts.\\n  weather?: Array<{\\n  // Number of days to return. Defaults to 7.\\n  duration?:
