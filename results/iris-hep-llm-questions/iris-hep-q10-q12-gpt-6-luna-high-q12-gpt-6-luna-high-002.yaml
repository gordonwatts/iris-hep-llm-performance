    ''/home/gwatts/llms-test/test-wsl2-llm-WeM7B73t/.harness/codex-home/plugins/cache/iris-hep-tools/iris-hep/1.0.0-RC.3/skills/hist/SKILL.md''; do echo \\\"--- \"''$f\"; cat \"$f\"; done''","aggregated_output":"--- /home/gwatts/llms-test/test-wsl2-llm-WeM7B73t/.harness/codex-home/plugins/cache/iris-hep-tools/iris-hep/1.0.0-RC.3/skills/servicex/references/servicex-hints.md\n# ServiceX FuncADL xAOD Code Snippets\n\nUse ServiceX to fetch data from `rucio` datasets on the GRID, skimming out only the data required from the events needed.\n\nBest practice (details below):\n\n1. Define your `base_query`\n2. Select the collections you need (jets, electrons)\n\n    - This should be a top level `Select`\n    - Select all the collections you need - do not make separate queries.\n    - Include singletons (like met or EventInfo) - you have to extract them at this level to use later.\n    - Apply selections at the object level if need be (using a nested `.Where`). This is important as it can dramatically
    reduce the amount of data that needs to be shipped out of ServiceX.\n    - Do not select the columns (like pt, eta, etc.) at this stage. Do that at the next stage.\n\n3. Apply any event level selections needed\n\n    - Use a top level `.Where` to do this.\n    - For example, only events with at least 2 jets.\n    - This is important as it can dramatically reduce the amount of data that needs to be shipped out of ServiceX.\n    - You can''t go back to the root event object from step 2 here - you can only reference what you defined in step 2.\n\n4. Select the items from the collections that need to be sent to the client. The jet pT or eta, MET.\n\n    - At this point the `Select` statement is over the dictionary of collections you built in step 2.\n    - And scale to the proper units (GeV, etc.).\n    - The final `Select` must be a single outer level `Select` with a dictionary as its result.\n\n5. Execute the query to fetch the data.\n\nNotes:\n\n- Quantities returned from servicex should
    be in units most people use at the LHC - GeV, meters, etc. Please convert from whatever the units of the input files are in.\n- NEVER nest a dictionary inside another dictionary. That will for sure cause a servicex crash.\n\n## A Simple Full Example\n\nThis example fetches the jet $p_T$''s from a PHYSLITE formatted xAOD data sample stored by `rucio`.\n\n```python\nfrom func_adl_servicex_xaodr25 import FuncADLQueryPHYSLITE\nfrom servicex import deliver, ServiceXSpec, Sample, dataset\n\n# The base query should run against PHYSLITE.\nbase_query = FuncADLQueryPHYSLITE()\n\n# Query: get all jet pT\njet_pts_query = (base_query\n    .Select(lambda evt: {\"jets\": evt.Jets()})\n    .Select(lambda collections: collections.jets.Select(lambda jet:\n    {\n        \"jet_pt\": jet.pt() / 1000.0,\n    })\n)\n\n# Do the fetch\n# Define the rucio dataset identifier (DID).\nds_name = (\"mc23_13p6TeV:mc23_13p6TeV.801167.Py8EG_A14NNPDF23LO_jj_JZ2.deriv.DAOD_PHYSLITE.e8514_e8528_a911_s4114_r15224_r15225_p6697\")\n\nall_jet_pts_delivered
    = deliver(\n    ServiceXSpec(\n        Sample=[\n            Sample(\n                Name=\"jet_pt_fetch\",\n                Dataset=dataset.Rucio(ds_name),\n                NFiles=1,\n                Query=jet_pts_query,\n            )\n        ]\n    ),\n)\n```\n\n- `all_jet_pts_delivered` is a dictionary indexed by sample name. It contains a list of paths to ROOT files (in the form of a `GuardList`). For `NFiles=1`, there will be only a single file.\n  - If it makes sense in the code, add a command line option, or a default option to the function you are working on to change NFiles (e.g. `--n-files` with alias `-n`). It should default to 1, and `None` would be all files in the dataset. For the command line, `0` would represent all files. The user may already have some code that deals with this - in which case use that infrastructure.\n\n## The `deliver` function\n\n- Default to `NFiles=1` because large datasets can take a lot of time. While adding a command line option to change
    it is fine, defaulting to the full dataset is not - until the user has done sufficient testing.\n- The query can be re-used.\n- Use `dataset.Rucio` for a `rucio` dataset, use `dataset.FileList` for a list of web accessible datasets (via `https` or `xrootd://`)\n- Only call deliver once - make sure all the data you want is in the query, even if multiple samples - just add more to the `Sample` array.\n- If cache bypass is requested or needed for stress/repeat testing, set `ignore_local_cache=True` (argument to the `deliver` function).\n\nThere are two ways to access the output of the `deliver` function.\n\n1. If the output is small enough you expect to be able to run in-memory. For quick studies, etc., this works very well and is quite easy.\n\n  a. Make sure the `servicex_analysis_utilities` package is included in the project''s dependencies.\n  b. The following code will turn the output above into a single awkward array:\n\n  ```python\n  from servicex_analysis_utils import to_awk\n\n  all_jets_pts_awk
    = to_awk(all_jet_pts_delivered)\n  jet_pts = all_jets_pts_awk[\"jet_pt_fetch\"]\n  ```\n\n1. Use the ROOT files directly. These can be used with RDataFrame or `uproot`. If you have to deal with a very large amount of data that won''t fit in memory, this is the proper approach.\n\n    a. The following code gets a list of all the ROOT files (if `NFiles==1` then there will be only one).\n\n    ```python\n    file_list = [str(p) for p in all_jet_pts_delivered[''jet_pt_fetch'']\n    ```\n\n## Base Query\n\nQueries have to start from a base, like `FuncADLQueryPHYSLITE`.\n\n- Assume all queries are on Release 25 datasets (the `func_adl_servicex_xaodr25` package)\n- Use `FuncADLQueryPHYSLITE` for ATLAS PHYSLITE samples - that have already had calibrations, etc., applied.\n- Use `FuncADLQueryPHYS` for ATLAS PHYS or other derivations (like LLP1, etc.). These aren''t calibrated, so this will try to run calibrations.\n\nThe `base_query` is a sequence of events. Each event contains collections of
    objects like Jets and Electrons. `evt.Jets()` gets you the collection of jets for a particular event. You can pass `calibrated=False` to prevent calibration in `PHYS`, but note that `PHYSLITE` does not have uncalibrated jets (or other objects) in it! This `func_adl` language is based on LINQ.\n\n`ServiceX` queries can not contain references to `awkward` functions. Instead, use `Select`, `Where`, to effect the same operations.\n\nTo tell what kind of data you are looking at, scan the name of the dataset:\n\n- If it has PHYSLITE in it, it is PHYSLITE.\n- If it has DAOD_PHYS in it, it is PHYS.\n- If it is OpenData, then it is PHYSLITE. It usually has OpenData in the name somewhere. There are a few differences in how you code against OpenData - look carefully at the instructions.\n\n## Filtering in a Query\n\nUse the `Where` operator to filter objects by a condition, and replace the above nested `Select` (the `jets.Select(lambda jet:`) with a `.Where(lambda jet: jet.pt()/1000.0 > 200.)`.
    You can have a complex expression and can use `and` and `or` from python operators. You can also have a sequence of `.Where` statements chained.\n\nYou can also filter events by putting a `.Where` at the top level. Here is an example that looks for at least 2 jets with a pT cut:\n\n```python\nquery = (FuncADLQueryPHYSLITE()\n    .Where(lambda e: e.Jets()\n                      .Where(lambda j: j.pt() / 1000.0 > 30.0)\n                      .Count() >= 2)\n    .Select(lambda e: {''NumJets'': e.Jets().Count()})\n)\n```\n\n## Multiple Object Collections\n\nFuncADL queries can return multiple collections simultaneously (e.g. electrons and muons). The best practice it to chain two top level `Select` statements. The first selects the required collections and applies any top level selections to those object. The second builds the return data and any necessary calculations.\n\n```python\nquery = (FuncADLQueryPHYSLITE()\n    .Select(lambda e: {\n        ''ele'': e.Electrons().Select(lambda e:
    e.pt()/1000 > 30), \n        ''mu'': e.Muons().Select(lambda m: abs(m.eta()) < 2.5)\n    }))\n    .Select(lambda pairs: {\n        ''ele_pt'':  pairs.ele.Select(lambda ele: ele.pt()/1000),\n        ''ele_eta'': pairs.ele.Select(lambda ele: ele.eta())\n        ''mu_pt'': pairs.mu.Select(lambda mu: mu.pt()/1000),\n        ''mu_eta'': pairs.mu.Select(lambda mu: mu.eta())\n    })\n```\n\nNote:\n\n- Any collations or items you want to access in the second select statement must be passed through from the first.\n\n## Errors\n\nIf you encounter an error after running, there are two types. The first give you type errors, and those you can solve just by reading the error message carefully and perhaps not doing whatever the code complained about. You might have to look carefully for this message - for example \"Method xxx not found on object.\"\n\nThe second type of error there isn''t much you can do to get more information, however. You''ll find an error that looks like \"Transform \"xxx\" completed
    with failures.\" And something in `stdout` about clicking on `HERE` to get more information. Sadly, only the requester can do that. If that happens just reply with \"HELP USER\" and that will be a signal. Note that you might get an error as mentioned above and this - in which case try to solve the error before getting the user involved. A common case here is you request some data that should be in the datafiles, but is not.\n\n## Dependency caveat\n\n- Ensure `func_adl_servicex_xaodr25` is installed and importable in the active environment.\n- In standalone scripts using inline metadata, include `jinja2` explicitly if imports/runtime require it.\n--- /home/gwatts/llms-test/test-wsl2-llm-WeM7B73t/.harness/codex-home/plugins/cache/iris-hep-tools/iris-hep/1.0.0-RC.3/skills/servicex/references/datamodel-xaod-objects.md\n# xAOD Objects: Jets, Muons, Photons, Electrons\n\nIt is possible to access all these objects from the top event level, e.g.,\n\n```python\nquery = FuncADLQueryPHYS() \\\n    .Select(lambda
    e: e.Jets()) \\\n    .Select(lambda jets: {\n        \"pt\": jets.Select(lambda j: j.pt() / 1000.0),\n        \"eta\": jets.Select(lambda j: j.eta() / 1000.0),\n    })\n```\n\nThese objects all have `pt`, `eta`, `phi` (with methods by those names). To access `px`, `py`, `pz` you have to get the 4-vector first:\n\n```python\nquery = FuncADLQueryPHYS() \\\n    .Select(lambda e: e.Jets()) \\\n    .Select(lambda jets: {\n        \"pt\": jets.Select(lambda j: j.p4().px() / 1000.0),\n    })\n```\n--- /home/gwatts/llms-test/test-wsl2-llm-WeM7B73t/.harness/codex-home/plugins/cache/iris-hep-tools/iris-hep/1.0.0-RC.3/skills/servicex/references/datamodel-xaod-units.md\n# xAOD Units\n\nImportant note about units:\n\n- All momentum, energy, and mass units are in MeV (e.g. `pt`, `E`, `m`). Unless asked otherwise, convert them to GeV by dividing by 1000 as early as possible.\n- All distance units are in millimeters. Convert them to meters as early as possible.\n--- /home/gwatts/llms-test/test-wsl2-llm-WeM7B73t/.harness/codex-home/skills/.system/standalone-script/SKILL.md\ncat:
    /home/gwatts/llms-test/test-wsl2-llm-WeM7B73t/.harness/codex-home/skills/.system/standalone-script/SKILL.md: No such file or directory\n--- /home/gwatts/llms-test/test-wsl2-llm-WeM7B73t/.harness/codex-home/plugins/cache/iris-hep-tools/iris-hep/1.0.0-RC.3/skills/awkward-array/SKILL.md\n---\nname: awkward-array\ndescription: Guidance for working with Awkward Array 2.0 jagged arrays and records in Python. Use when building or debugging `awkward` workflows, including record construction with `ak.zip`, adding fields with `ak.with_field`, filtering/aggregation, combinatorics (`ak.cartesian`/`ak.combinations`), `argmin`/`argmax` slicing, flattening, sorting, and NumPy interop or common Awkward pitfalls.\n---\n\n# Awkward Array\n\n## Overview\n\nUse this skill to apply Awkward 2.0 best practices for jagged arrays, especially in HEP-style event data models. Keep guidance lean in this file and load reference notes only when needed.\n\n## Core workflow\n\n1. Build an event data model (records)
    with `ak.zip`.\n2. Filter early at the event level.\n3. Perform combinatorics or derived calculations.\n4. Add derived fields back into the record with `ak.with_field`.\n5. Repeat until the final values are present in the EDM.\n\n## Reference guide\n\nLoad only the reference files that matches the task:\n\n- `references/best-practices.md`: use when setting overall approach or reminding about Awkward 2.0 usage and axes.\n- `references/records.md`: use when building records or adding fields.\n- `references/filtering-aggregation.md`: use for boolean masking, `ak.sum`/`ak.count`/`ak.num`, and axis guidance.\n- `references/sorting.md`: use for `ak.sort`.\n- `references/combinatorics.md`: use for pairings or n-way combinations (`ak.cartesian`, `ak.combinations`).\n- `references/argmin-argmax.md`: use when selecting min/max elements in jagged lists.\n- `references/flattening.md`: use for `ak.flatten` behavior and axis rules.\n- `references/numpy-interop.md`: use when mixing NumPy operations
    with Awkward arrays.\n- `references/pitfalls.md`: use for common API mistakes and missing functions.\n- `references/awkward-files.md`: use for file I/O patterns (read/write) with Awkward arrays.\n\n## Constraints\n\n- Use Awkward 2.0 APIs and syntax only.\n- Avoid `axis=None` unless the function explicitly supports it.\n- Ensure `awkward` is listed as a dependency in the active environment (venv plus `pyproject.toml` or `requirements.txt`).\n--- /home/gwatts/llms-test/test-wsl2-llm-WeM7B73t/.harness/codex-home/plugins/cache/iris-hep-tools/iris-hep/1.0.0-RC.3/skills/vector-awkward/SKILL.md\n---\nname: vector-awkward\ndescription: Use when working in Python with scikit-hep vector and Awkward Array to build vector records, register behaviors, compute deltaR or invariant masses, combine or boost vectors, or access vector properties from ak.zip records of type (Momentum3D/Momentum4D/Vector4D). Vector is only useful if you are also using Awkward.\n---\n\n# Vector Awkward\n\n## Overview\n\nCreate
    Awkward Arrays that behave like vector objects and use vector methods without writing custom kinematic math. Use these steps to register behaviors, build records with the right field names, and perform common HEP operations like deltaR and invariant mass.\n\n## Quick Start\n\n1. Register vector behaviors once per session:\n\n```python\nimport vector\nvector.register_awkward()\n```\n\n1. Build vector records with standard field names and a vector type name:\n\n```python\nimport awkward as ak\n\nevents = ak.Array({\n    \"electron\": ak.zip(\n        {\"pt\": [50.0, 30.2], \"eta\": [1.4, -0.8], \"phi\": [2.1, 0.5], \"mass\": [0.0005, 0.0005]},\n        with_name=\"Momentum4D\",\n    )\n})\n```\n\n## Build Vector Records\n\n- Use `ak.zip(..., with_name=\"Momentum3D\")` for 3D operations like deltaR.\n- Use `ak.zip(..., with_name=\"Momentum4D\")` for 4D operations like invariant mass or boosts.\n- Prefer standard names like `pt/eta/phi/mass` or `px/py/pz/E` so vector can infer coordinate
    systems.\n- Call `vector.register_awkward()` before accessing vector properties or methods.\n\n## Access Vector Properties\n\n```python\nparticles = ak.zip({\"px\": px, \"py\": py, \"pz\": pz, \"E\": E}, with_name=\"Vector4D\")\nparticles.pt\nparticles.phi\nparticles.eta\nparticles.mass\n```\n\n## Common Operations\n\nCalculate deltaR between two collections:\n\n```python\npairs = ak.cartesian([events.electron, events.muon])\nelectrons, muons = ak.unzip(pairs)\ndR = electrons.deltaR(muons)\n```\n\nCombine 4-vectors and compute invariant mass:\n\n```python\nfirst_e, second_e = ak.unzip(ak.combinations(events.electron, 2))\ninv_mass = (first_e + second_e).mass\n```\n\nBoost to a parent rest frame:\n\n```python\nparent = particle1 + particle2\nparticle1_rf = particle1.boostCM_of_p4(parent)\n```\n\n## Reference Material\n\nLoad `references/vector-hints.md` for more examples, method notes, and advanced snippets.\n--- /home/gwatts/llms-test/test-wsl2-llm-WeM7B73t/.harness/codex-home/plugins/cache/iris-hep-tools/iris-hep/1.0.0-RC.3/skills/hist/SKILL.md\n---\nname:
    hist\ndescription: Use when working with the scikit-hep hist library in Python to create, fill, slice, and plot histograms (1D/2D/multi-axis), including UHI indexing, categorical axes, and mplhep plotting conventions.\n---\n\n# Hist\n\n## Overview\n\nUse this skill to build and manipulate hist.Hist objects, choose axis/storage types, fill with data and weights, and produce publication-style plots with mplhep styles, all based on matplotlib.\n\n## Quick start\n\n- Create histograms with `Hist.new` plus axis builders (`Reg`, `Var`, `StrCat`) and finish with exactly one storage (`Int64` or `Weight`).\n- Make sure axis labels contain a short variable name and units. Histogram titles should contains a slightly longer concise description of what data went into the plot.\n- Fill with `.fill(...)` using axis names; note that `.fill` returns `None`.\n- Slice or project with UHI indexing (e.g., `h.project(\"x\")` or `h[{\"x\": 5j}]`).\n- Plot with `hist.plot(...)` or `mplhep.hist2dplot(...)`;
    use `plt.style.use(hep.style.ATLAS)` for HEP-style plots.\n\n## Core tasks\n\n### Create axes and storage\n\n- Use `Reg` for uniform bins and `Var` for variable-width bins.\n- Use `StrCat` for categorical axes; set `growth=True` for auto-added categories.\n- Choose storage: `Int64` for unweighted counts, `Weight` for weighted fills.\n\n### Fill and access contents\n\n- Fill with named axes (e.g., `h.fill(x=..., y=..., weight=...)`).\n- Read counts with `h.view()` and errors from `np.sqrt(h.variances())`.\n\n### Slice, rebin, and project\n\n- Use UHI slicing (complex numbers for bin selection, `::2j` for rebinning).\n- Project with `h.project(\"axis_name\")` for 1D plots.\n\n### Plot and save\n\n- Use `hist.plot(histtype=\"fill\")` for 1D; use `mplhep.hist2dplot` for 2D.\n- Use `plt.subplots()` without custom `figsize` unless explicitly requested.\n- Save with `fig.savefig(\"name.png\")` and close with `plt.close(fig)`.\n\n## References\n\n- Use `references/hist-hints.md` for concrete
    code snippets and common patterns.\n- Use `references/hist-advanced.md` for UHI indexing, plotting gotchas, and label/LaTeX guidance.\n- Use `references/lhc-hist-ranges.md` for starting suggestions on histogram axis ranges and binning.\n","exit_code":0,"status":"completed"}}

