      use for file I/O patterns (read/write) with Awkward arrays.\\n\\n## Constraints\\n\\n- Use Awkward 2.0 APIs and syntax only.\\n- Avoid `axis=None` unless the function explicitly supports it.\\n- Ensure `awkward` is listed as a dependency in the active environment (venv plus `pyproject.toml` or `requirements.txt`).\\n---\\nname: hist\\ndescription: Use when working with the scikit-hep hist library in Python to create, fill, slice, and plot histograms (1D/2D/multi-axis), including UHI indexing, categorical axes, and mplhep plotting conventions.\\n---\\n\\n# Hist\\n\\n## Overview\\n\\nUse this skill to build and manipulate hist.Hist objects, choose axis/storage types, fill with data and weights, and produce publication-style plots with mplhep styles, all based on matplotlib.\\n\\n## Quick start\\n\\n- Create histograms with `Hist.new` plus axis builders (`Reg`, `Var`, `StrCat`) and finish with exactly one storage (`Int64` or `Weight`).\\n- Make sure axis labels contain a short variable
      name and units. Histogram titles should contains a slightly longer concise description of what data went into the plot.\\n- Fill with `.fill(...)` using axis names; note that `.fill` returns `None`.\\n- Slice or project with UHI indexing (e.g., `h.project(\\\"x\\\")` or `h[{\\\"x\\\": 5j}]`).\\n- Plot with `hist.plot(...)` or `mplhep.hist2dplot(...)`; use `plt.style.use(hep.style.ATLAS)` for HEP-style plots.\\n\\n## Core tasks\\n\\n### Create axes and storage\\n\\n- Use `Reg` for uniform bins and `Var` for variable-width bins.\\n- Use `StrCat` for categorical axes; set `growth=True` for auto-added categories.\\n- Choose storage: `Int64` for unweighted counts, `Weight` for weighted fills.\\n\\n### Fill and access contents\\n\\n- Fill with named axes (e.g., `h.fill(x=..., y=..., weight=...)`).\\n- Read counts with `h.view()` and errors from `np.sqrt(h.variances())`.\\n\\n### Slice, rebin, and project\\n\\n- Use UHI slicing (complex numbers for bin selection, `::2j` for rebinning).\\n-
      Project with `h.project(\\\"axis_name\\\")` for 1D plots.\\n\\n### Plot and save\\n\\n- Use `hist.plot(histtype=\\\"fill\\\")` for 1D; use `mplhep.hist2dplot` for 2D.\\n- Use `plt.subplots()` without custom `figsize` unless explicitly requested.\\n- Save with `fig.savefig(\\\"name.png\\\")` and close with `plt.close(fig)`.\\n\\n## References\\n\\n- Use `references/hist-hints.md` for concrete code snippets and common patterns.\\n- Use `references/hist-advanced.md` for UHI indexing, plotting gotchas, and label/LaTeX guidance.\\n- Use `references/lhc-hist-ranges.md` for starting suggestions on histogram axis ranges and binning.\\n\"}\n[{\"name\":\"image_gen__imagegen\",\"description\":\"Tools in the image_gen namespace.\\n\\nThe `image_gen.imagegen` tool enables image generation from descriptions and editing of existing images based on specific instructions. Use it when:\\n\\n- The user requests an image based on a scene description, such as a diagram, portrait, comic, meme, or any other
      visual.\\n- The user wants to modify an attached or previously generated image with specific changes, including adding or removing elements, altering colors, improving quality/resolution, or transforming the style (e.g., cartoon, oil painting).\\n\\nGuidelines:\\n- imagegen needs a few minutes to finish. In code-mode, use the first-line @exec directive to give the initial call 120 seconds and the same yield for any waits that follow. Once it finishes, return the image with generatedImage(result).\\n- Avoid printing the full result or its base64 image data with `text()` or `notify()`; print only small metadata when needed.\\n- Set `transparent_background` to true when the request calls for a transparent background, including background removal or a cutout; set it to false otherwise. For edits, preserve existing transparency unless the user asks to change it.\\n- Omit both `referenced_image_paths` and `num_last_images_to_include` when generating a brand new image.\\n- For edits, use
      `referenced_image_paths` when every target image has a local file path.\\n- If you have not seen a local image yet, use `view_image` to inspect it before editing.\\n- Use `num_last_images_to_include` only when at least one target image has no local file path.\\n- Set `num_last_images_to_include` to the smallest number of recent conversation images that includes every target image, up to 5.\\n- Never provide both `referenced_image_paths` and `num_last_images_to_include`.\\n- If neither mechanism can include every target image, ask the user to attach the missing images again.\\n- Directly generate the image without reconfirmation or clarification unless required images must be attached again.\\n- Always use this tool for image editing unless the user explicitly requests otherwise. Do not use the `python` tool for image editing unless specifically instructed.\\n\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { image_gen__imagegen(args: {\\n  num_last_images_to_include?: number
      | null;\\n  prompt: string;\\n  referenced_image_paths?: Array<string> | null;\\n  // Whether the output should have a transparent background. Defaults to false.\\n  transparent_background?: boolean;\\n}): Promise<unknown>; };\\n```\"},{\"name\":\"mcp__codex_apps__sites_add_custom_domain\",\"description\":\"Use Sites to build or modify websites, including landing pages, portfolios, dashboards, portals, trackers, hubs, and internal tools. Use Sites skills for local implementation, source preparation, and artifact packaging. Use this connector for site creation, runtime environment variables, versions, production deployments, and access controls. Read .openai/hosting.json before creating a site and reuse its project_id when present. Treat Sites IDs and cursors as opaque: copy them exactly from .openai/hosting.json or Sites responses as applicable, and never invent, reformat, derive, or substitute them. Never call create_site more than once for the same local site. Push the exact source
      state before saving a version. commit_sha must identify that pushed state, and any archive must be built from it. Deploy only saved versions; every Sites deployment URL is production. Inspect deployment status when the initial result is non-terminal or the user asks for progress. Publish after creating or editing a site by default, including on subsequent turns, unless the user explicitly requested local-only work, a saved version without deployment, or no publishing. New sites start private. Preserve the site''s current audience unless the user explicitly requests a different audience. Use the private operation for known owner-private sites and let it enforce owner-only access. Runtime tool approvals and backend access checks still apply without a separate conversational deployment confirmation.\\n\\nAdd a custom domain to a published site. The response includes a CNAME target for subdomains, A record targets for zone apex domains, and all App Garden and Cloudflare validation records
      that must be set before the custom domain can route to the Site.\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__sites_add_custom_domain(args: {\\n  // Bare custom hostname, such as www.example.com\\n  hostname: string;\\n  // Exact opaque site project ID. Copy it verbatim from .openai/hosting.json''s project_id or the id field returned by create_site, list_sites, or get_site, or the server-returned site_metadata.project_id on a Library Site result. Keep the same selected workspace. Never invent, modify, or substitute another identifier.\\n  project_id: string;\\n}): Promise<CallToolResult<{\\n  // A record targets to use when the custom hostname is a zone apex.\\n  apex_proxy_ipv4_targets: Array<string>;\\n  // CNAME target to use for custom subdomains.\\n  cname_target: string | null;\\n  created_at: string;\\n  hostname: string;\\n  id: string;\\n  last_error: string | null;\\n  project_id: string;\\n  provider_status: string | null;\\n  ssl_status:
      string | null;\\n  status: \\\"pending\\\" | \\\"active\\\" | \\\"failed\\\";\\n  updated_at: string;\\n  validation_records: Array<{ name?: string | null; record_type?: string | null; value?: string | null; }>;\\n  worker_name: string;\\n}>>; };\\n```\"},{\"name\":\"mcp__codex_apps__sites_change_site_slug\",\"description\":\"Use Sites to build or modify websites, including landing pages, portfolios, dashboards, portals, trackers, hubs, and internal tools. Use Sites skills for local implementation, source preparation, and artifact packaging. Use this connector for site creation, runtime environment variables, versions, production deployments, and access controls. Read .openai/hosting.json before creating a site and reuse its project_id when present. Treat Sites IDs and cursors as opaque: copy them exactly from .openai/hosting.json or Sites responses as applicable, and never invent, reformat, derive, or substitute them. Never call create_site more than once for the same local site.
      Push the exact source state before saving a version. commit_sha must identify that pushed state, and any archive must be built from it. Deploy only saved versions; every Sites deployment URL is production. Inspect deployment status when the initial result is non-terminal or the user asks for progress. Publish after creating or editing a site by default, including on subsequent turns, unless the user explicitly requested local-only work, a saved version without deployment, or no publishing. New sites start private. Preserve the site''s current audience unless the user explicitly requests a different audience. Use the private operation for known owner-private sites and let it enforce owner-only access. Runtime tool approvals and backend access checks still apply without a separate conversational deployment confirmation.\\n\\nChange a site''s public URL label. The change runs asynchronously. When the result is pending, use get_site to observe the current slug; do not call this mutation
      again to poll.\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__sites_change_site_slug(args: {\\n  // Exact opaque site project ID. Copy it verbatim from .openai/hosting.json''s project_id or the id field returned by create_site, list_sites, or get_site, or the server-returned site_metadata.project_id on a Library Site result. Keep the same selected workspace. Never invent, modify, or substitute another identifier.\\n  project_id: string;\\n  // New public URL label for the site.\\n  slug: string;\\n}): Promise<CallToolResult<{\\n  auth_client_id: string | null;\\n  created_at: string;\\n  current_live_url: string | null;\\n  current_preview_url: string | null;\\n  description: string | null;\\n  disabled_by?: \\\"workspace_admin\\…28200 tokens truncated…ace editors to add or remove from the Site.\\n  editor_changes?: { add_editor_account_user_ids?: Array<string>; add_editor_group_ids?: Array<string>; remove_editor_account_user_ids?: Array<string>; remove_editor_group_ids?:
      Array<string>; } | null;\\n  // Exact opaque site project ID. Copy it verbatim from .openai/hosting.json''s project_id or the id field returned by create_site, list_sites, or get_site, or the server-returned site_metadata.project_id on a Library Site result. Keep the same selected workspace. Never invent, modify, or substitute another identifier.\\n  project_id: string;\\n  // Same-workspace viewers to add or remove without replacing existing access.\\n  viewer_changes?: { add_external_visitor_emails?: Array<string>; add_viewer_account_user_ids?: Array<string>; add_viewer_workspace_group_ids?: Array<string>; remove_external_visitor_emails?: Array<string>; remove_viewer_account_user_ids?: Array<string>; remove_viewer_workspace_group_ids?: Array<string>; } | null;\\n}): Promise<CallToolResult<{\\n  // Access mode for the app.\\n  access_mode: \\\"public\\\" | \\\"admins_only\\\" | \\\"workspace_all\\\" | \\\"custom\\\";\\n  // Account user ID allowlist for the app.\\n  allowed_account_user_ids:
      Array<string>;\\n  // Accepted project editors in the current workspace.\\n  allowed_editors?: Array<{\\n  // Stable row identifier. This is an account user ID for a workspace user and an external visitor grant ID when is_external is true.\\n  account_user_id: string;\\n  avatar_url?: string | null;\\n  // Email address for the allowed user, when available.\\n  email?: string | null;\\n  // True when this email is authorized as an external visitor rather than through workspace membership.\\n  is_external?: boolean | null;\\n  // Display name for the allowed user, when available.\\n  name?: string | null;\\n  pending?: boolean;\\n  // Project sharing role when supplied by the current access response.\\n  role?: \\\"owner\\\" | \\\"editor\\\" | \\\"viewer\\\" | null;\\n}>;\\n  // Group details resolved from allowed workspace and tenant group IDs.\\n  allowed_groups: Array<{\\n  // Group ID to use in an Appgen access policy.\\n  id: string;\\n  // Group display name.\\n  name: string;\\n  pending?:
      boolean;\\n  // Site sharing role when supplied by the current access response.\\n  role?: \\\"viewer\\\" | \\\"editor\\\" | null;\\n  // Total number of members in the group.\\n  size: number;\\n}>;\\n  // Tenant group ID allowlist for the app.\\n  allowed_tenant_group_ids: Array<string>;\\n  // Allowed workspace users and email-bound external visitors. External visitors use their grant ID as account_user_id and set is_external.\\n  allowed_users: Array<{\\n  // Stable row identifier. This is an account user ID for a workspace user and an external visitor grant ID when is_external is true.\\n  account_user_id: string;\\n  avatar_url?: string | null;\\n  // Email address for the allowed user, when available.\\n  email?: string | null;\\n  // True when this email is authorized as an external visitor rather than through workspace membership.\\n  is_external?: boolean | null;\\n  // Display name for the allowed user, when available.\\n  name?: string | null;\\n  pending?: boolean;\\n  //
      Project sharing role when supplied by the current access response.\\n  role?: \\\"owner\\\" | \\\"editor\\\" | \\\"viewer\\\" | null;\\n}>;\\n  // Workspace group ID allowlist for the app.\\n  allowed_workspace_group_ids: Array<string>;\\n  // Number of email-bound external visitors allowed to view the site.\\n  external_visitor_count?: number;\\n  // Appgen project ID\\n  project_id: string;\\n  // Monotonic access policy revision.\\n  revision: number;\\n  // Access policy update timestamp.\\n  updated_at: string;\\n}>>; };\\n```\"},{\"name\":\"mcp__codex_apps__sites_update_site_metadata\",\"description\":\"Use Sites to build or modify websites, including landing pages, portfolios, dashboards, portals, trackers, hubs, and internal tools. Use Sites skills for local implementation, source preparation, and artifact packaging. Use this connector for site creation, runtime environment variables, versions, production deployments, and access controls. Read .openai/hosting.json before creating
      a site and reuse its project_id when present. Treat Sites IDs and cursors as opaque: copy them exactly from .openai/hosting.json or Sites responses as applicable, and never invent, reformat, derive, or substitute them. Never call create_site more than once for the same local site. Push the exact source state before saving a version. commit_sha must identify that pushed state, and any archive must be built from it. Deploy only saved versions; every Sites deployment URL is production. Inspect deployment status when the initial result is non-terminal or the user asks for progress. Publish after creating or editing a site by default, including on subsequent turns, unless the user explicitly requested local-only work, a saved version without deployment, or no publishing. New sites start private. Preserve the site''s current audience unless the user explicitly requests a different audience. Use the private operation for known owner-private sites and let it enforce owner-only access. Runtime
      tool approvals and backend access checks still apply without a separate conversational deployment confirmation.\\n\\nUpdate a site''s display title. This does not change the site''s public URL.\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__sites_update_site_metadata(args: {\\n  // Exact opaque site project ID. Copy it verbatim from .openai/hosting.json''s project_id or the id field returned by create_site, list_sites, or get_site, or the server-returned site_metadata.project_id on a Library Site result. Keep the same selected workspace. Never invent, modify, or substitute another identifier.\\n  project_id: string;\\n  // New user-facing site title.\\n  title: string;\\n}): Promise<CallToolResult<{\\n  auth_client_id: string | null;\\n  created_at: string;\\n  current_live_url: string | null;\\n  current_preview_url: string | null;\\n  description: string | null;\\n  disabled_by?: \\\"workspace_admin\\\" | \\\"openai\\\" | null;\\n  // Opaque site project
      ID. Pass this exact value as project_id.\\n  id: string;\\n  latest_edit_context?: { chatgpt_conversation_id?: string | null; codex_thread_id?: string | null; } | null;\\n  latest_version_number: number;\\n  screenshot_url: string | null;\\n  slug: string;\\n  status: \\\"creating\\\" | \\\"active\\\" | \\\"suspended\\\" | \\\"deleting\\\";\\n  title: string;\\n  updated_at: string;\\n}>>; };\\n```\"},{\"name\":\"mcp__codex_apps__slack_slack_get_file_upload_url\",\"description\":\"Share work and pull context\\n\\nGenerates a signed upload URL for a file, plus a file ID. This is the first step of the two-step upload flow: POST the raw file bytes to the returned upload URL (set Content-Type to match the file type, and Content-Length to exactly match the content_length parameter), then call slack_complete_file_upload with the file ID to finalize and share the file.\\n\\nUse snippet_type for code snippets and alt_txt to describe images for accessibility. Returns an error if file uploads
      are disabled for the workspace, the file exceeds the workspace upload size limit, or the workspace upload rate limit is exceeded.\\n\\nIMPORTANT — URL handling:\\n- The upload URL contains a signed token that is case-sensitive and must be used byte-for-byte exactly as returned. Do not URL-decode, re-encode, or manually reconstruct it. To avoid transcription errors, assign it to a shell variable rather than pasting inline: URL=''<returned_url>'' && curl -X POST \\\"$URL\\\" ...\\n- A 401 \\\"unauthorized\\\" response means either the URL was corrupted/malformed or has expired (after ~1 hour). The server does not distinguish between these cases. If you receive a 401, request a fresh URL.\\n\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__slack_slack_get_file_upload_url(args: {\\n  // Alt text description for image accessibility (max 1000 chars)\\n  alt_txt?: string;\\n  // Exact size of the file in bytes (minimum 1)\\n  content_length: number;\\n  // Name
      of the file being uploaded (e.g., ''report.pdf'')\\n  filename: string;\\n  // Link ID for the account this call should use. Supply link_id using a link_id value below. Select only from the accounts below. If multiple listed accounts could satisfy a write request and the intended account is not clear from the user''s request or conversation, ask which account to use before calling this tool.\\n  // [\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8bf582ee88191a8999a05c1170680\\\",\\n  // \\\"link_name\\\": \\\"HEP-Watts (Undergrads)\\\",\\n  // \\\"profile_id\\\": \\\"TB3SPQNQH:UB4DBQEP4\\\",\\n  // \\\"profile_name\\\": \\\"Gordon Watts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"TB3SPQNQH\\\",\\n  // \\\"profile_workspace_name\\\": \\\"HEP-Watts\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8be1b8a908191b09b9a7dcef4f239\\\",\\n  // \\\"link_name\\\": \\\"uw-teaching-team\\\",\\n  // \\\"profile_id\\\": \\\"T011H4V3RC6:U01HY74RW4U\\\",\\n  //
      \\\"profile_name\\\": \\\"Gordon Watts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"T011H4V3RC6\\\",\\n  // \\\"profile_workspace_name\\\": \\\"uw-phys-teaching-team\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8bdfc3868819199deeb7c48f56213\\\",\\n  // \\\"link_name\\\": \\\"CLARIPHY\\\",\\n  // \\\"profile_id\\\": \\\"T01FEB9RJFQ:U0B8EFYH9JA\\\",\\n  // \\\"profile_name\\\": \\\"gwatts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"T01FEB9RJFQ\\\",\\n  // \\\"profile_workspace_name\\\": \\\"CLARIPHY\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8beafcf508191901f7be18bcf12f2\\\",\\n  // \\\"link_name\\\": \\\"IRIS-HEP\\\",\\n  // \\\"profile_id\\\": \\\"TDFUQQ7UZ:UFG92F7TJ\\\",\\n  // \\\"profile_name\\\": \\\"Gordon Watts (he/him)\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"TDFUQQ7UZ\\\",\\n  //
      \\\"profile_workspace_name\\\": \\\"iris-hep\\\"\\n  // }\\n  // ]\\n  link_id: string;\\n  // Programming language for code snippets (e.g., ''python'', ''javascript'')\\n  snippet_type?: string;\\n}): Promise<CallToolResult>; };\\n```\"},{\"name\":\"mcp__codex_apps__slack_slack_read_list\",\"description\":\"Share work and pull context\\n\\nRead the contents of a Slack list including its column schema and records. Returns data as a markdown table (default) or CSV. The column headers are always part of the output (the table header in markdown, the first line in CSV). Each record row is prefixed with a \\\"Record ID\\\" column (the Rec… id); pass that value as record_id to slack_update_list_record to edit the row.\\n\\nProvide either list_id or list_title to identify the list. If both are given, list_id is tried first (an exact ID is unambiguous); if that ID does not resolve, the tool falls back to the list_title search and notes in the output that the provided ID was not used.\\n\\nArgs:\\n\\tlist_id
      (Optional[str]): The ID of the list to read (e.g., ''F0ABC123''). An exact, direct lookup — prefer this when known; it''s faster and unambiguous.\\n\\tlist_title (Optional[str]): The title of the list to read. Resolved via a fuzzy, relevance-ranked search (not an exact, case-sensitive match) — so it can be slower and less precise than list_id, may match several similarly-named lists, and may return a related list rather than an exact title match; the best match is used. Pass list_id to target a specific list among several with similar titles. If nothing matches, returns list_not_found.\\n\\tformat (Optional[str]): Output format - ''markdown'' (default) or ''csv''\\n\\tlimit (Optional[int]): Maximum number of records to return per page. Capped at 100 — larger values are clamped to 100, so reading more than 100 records requires paginating with cursor. Default: 100\\n\\tcursor (Optional[str]): Pagination cursor for fetching the next page of a multi-page read. Pass back the exact next_cursor
      string from a previous call''s output — it is an opaque token, so do not construct, parse, or modify it. Omit (or pass empty) to read from the first record.\\n\\tschema_only (Optional[bool]): When true, return only the column schema (names and types) and skip fetching records. Use this to answer \\\"what columns does this list have?\\\" without reading any rows. Default: false\\n\\nReturns:\\n\\tstr: List contents formatted as a markdown table or CSV data. When more records remain, the output includes a next_cursor to pass back in for the following page.\\n\\nExamples:\\n\\t- \\\"Read a list\\\" -> slack_read_list(list_id=''F0ABC123'')\\n\\t- \\\"Read a list by name\\\" -> slack_read_list(list_title=''Project Tracker'')\\n\\t- \\\"What columns does this list have?\\\" -> slack_read_list(list_id=''F0ABC123'', schema_only=true)\\n\\t- \\\"Export list as CSV\\\" -> slack_read_list(list_id=''F0ABC123'', format=''csv'')\\n\\t- \\\"Get first 10 rows\\\" -> slack_read_list(list_id=''F0ABC123'',
      limit=10)\\n\\t- \\\"Get the next page\\\" -> slack_read_list(list_id=''F0ABC123'', cursor=''<next_cursor from prior call>'')\\n\\nError Handling:\\n\\t- Returns error if neither list_id nor list_title is provided, or the list is not found\\n\\t- Returns error if user lacks access to the list\\n\\t- When list_title matches multiple lists, the best search match is read (no error); pass list_id to disambiguate\\n\\t- Returns \\\"invalid_cursor\\\" if the pagination cursor is malformed\\n\\t- Returns \\\"rate_limit_exceeded\\\" when too many reads are issued in a short window — back off, then retry\\n\\t- Returns \\\"feature_not_enabled\\\" if Slack lists are not available to this account — do not retry\\n\\t- Returns \\\"failure_fetching_records\\\" if the list could be read but came back malformed — retrying once is reasonable; treat a second occurrence as terminal\\n\\t- Other errors from the underlying record read surface as-is, e.g. \\\"missing_scope\\\" (the token lacks lists:read
      — do not retry) or \\\"internal_error\\\". Treat an unfamiliar code as terminal unless it names a rate limit.\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__slack_slack_read_list(args: {\\n  // Pagination cursor returned by a previous call as `next_cursor`. An opaque token — pass it back verbatim; do not construct or modify it. Omit to read from the first record.\\n  cursor?: string;\\n  // Output format: ''markdown'' (default) or ''csv''\\n  format?: \\\"markdown\\\" | \\\"csv\\\";\\n  // Maximum number of records to return. Default: 100\\n  limit?: number;\\n  // Link ID for the account this call should use. Supply link_id using a link_id value below. Select only from the accounts below. If multiple listed accounts could satisfy a write request and the intended account is not clear from the user''s request or conversation, ask which account to use before calling this tool.\\n  // [\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8bf582ee88191a8999a05c1170680\\\",\\n  //
      \\\"link_name\\\": \\\"HEP-Watts (Undergrads)\\\",\\n  // \\\"profile_id\\\": \\\"TB3SPQNQH:UB4DBQEP4\\\",\\n  // \\\"profile_name\\\": \\\"Gordon Watts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"TB3SPQNQH\\\",\\n  // \\\"profile_workspace_name\\\": \\\"HEP-Watts\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8be1b8a908191b09b9a7dcef4f239\\\",\\n  // \\\"link_name\\\": \\\"uw-teaching-team\\\",\\n  // \\\"profile_id\\\": \\\"T011H4V3RC6:U01HY74RW4U\\\",\\n  // \\\"profile_name\\\": \\\"Gordon Watts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"T011H4V3RC6\\\",\\n  // \\\"profile_workspace_name\\\": \\\"uw-phys-teaching-team\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8bdfc3868819199deeb7c48f56213\\\",\\n  // \\\"link_name\\\": \\\"CLARIPHY\\\",\\n  // \\\"profile_id\\\": \\\"T01FEB9RJFQ:U0B8EFYH9JA\\\",\\n  // \\\"profile_name\\\": \\\"gwatts\\\",\\n  //
