      (`ak.cartesian`/`ak.combinations`), `argmin`/`argmax` slicing, flattening, sorting, and NumPy interop or common Awkward pitfalls. (file: r1/awkward-array/SKILL.md)\n- iris-hep:cli-creator: Create or extend Python command-line interfaces using Typer and wire them into pyproject.toml entry points. Use when asked to add a new CLI, add a subcommand, or expose a console script for a Python package, especially when pyproject.toml needs [project.scripts] updates or an empty directory needs full project initialization. (file: r1/cli-creator/SKILL.md)\n- iris-hep:hist: Use when working with the scikit-hep hist library in Python to create, fill, slice, and plot histograms (1D/2D/multi-axis), including UHI indexing, categorical axes, and mplhep plotting conventions. (file: r1/hist/SKILL.md)\n- iris-hep:servicex: Write and debug ServiceX queries in func_adl against ATLAS xAOD data (PHYSLITE/PHYS), including dataset selection, filtering, hosted delivery, and local WSL2 reproduction of failing transforms.
