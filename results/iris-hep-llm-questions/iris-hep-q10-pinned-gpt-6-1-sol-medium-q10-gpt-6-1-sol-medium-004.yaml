      or the server-returned site_metadata.project_id on a Library Site result. Keep the same selected workspace. Never invent, modify, or substitute another identifier.\\n  project_id: string;\\n}): Promise<CallToolResult<{\\n  // A record targets to use when the custom hostname is a zone apex.\\n  apex_proxy_ipv4_targets: Array<string>;\\n  // CNAME target to use for custom subdomains.\\n  cname_target: string | null;\\n  created_at: string;\\n  hostname: string;\\n  id: string;\\n  last_error: string | null;\\n  project_id: string;\\n  provider_status: string | null;\\n  ssl_status: string | null;\\n  status: \\\"pending\\\" | \\\"active\\\" | \\\"failed\\\";\\n  updated_at: string;\\n  validation_records: Array<{ name?: string | null; record_type?: string | null; value?: string | null; }>;\\n  worker_name: string;\\n}>>; };\\n```\"},{\"name\":\"mcp__codex_apps__sites_change_site_slug\",\"description\":\"Use Sites to build or modify websites, including landing pages, portfolios, dashboards,
