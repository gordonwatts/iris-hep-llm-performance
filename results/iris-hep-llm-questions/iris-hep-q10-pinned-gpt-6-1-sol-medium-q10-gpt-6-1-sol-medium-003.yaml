      work and pull context\\n\\nSends a message to a Slack channel or user. To DM a user, use their user_id as channel_id. Return the message link to the user.\\n\\nMessage uses standard markdown (**bold**, _italic_, `code`, ~~strikethrough~~, >blockquotes, lists, links, code blocks, tables, headers). Limited to 5000 chars per text element. Tables use standard Markdown syntax with `|` as column delimiters. Do NOT escape the structural `|` characters that form the table borders and column separators. Only escape `|` as `\\\\|` when a literal pipe character appears inside a cell value. Code blocks can include a language specifier (e.g. ```python, ```js, ```bash) for syntax highlighting and copy functionality. Do not include sensitive info in link query params. Cannot post to externally shared (Slack Connect) channels.\\n\\nThread replies: set thread_ts to parent message timestamp, reply_broadcast=true to also post to channel.\\n\\nLink previews: when your message contains links from apps
      installed in the workspace (e.g. GitHub, Jira, Figma), set unfurl_app_links=true to enable rich link previews for those URLs.\\n\\nUse slack_search_channels to find channel IDs, slack_search_users to find user IDs.\\nIf user explicitly requests a draft, use slack_send_message_draft instead.\\n\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__slack_slack_send_message(args: {\\n  // Search all channels\\n  channel_id: string;\\n  // ID of the draft to delete after sending\\n  draft_id?: string;\\n  // Link ID for the account this call should use. Supply link_id using a link_id value below. Select only from the accounts below. If multiple listed accounts could satisfy a write request and the intended account is not clear from the user''s request or conversation, ask which account to use before calling this tool.\\n  // [\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8bf582ee88191a8999a05c1170680\\\",\\n  // \\\"link_name\\\": \\\"HEP-Watts (Undergrads)\\\",\\n  //
