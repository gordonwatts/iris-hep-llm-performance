      \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"TDFUQQ7UZ\\\",\\n  // \\\"profile_workspace_name\\\": \\\"iris-hep\\\"\\n  // }\\n  // ]\\n  link_id: string;\\n  // Programming language for code snippets (e.g., ''python'', ''javascript'')\\n  snippet_type?: string;\\n}): Promise<CallToolResult>; };\\n```\"},{\"name\":\"mcp__codex_apps__slack_slack_read_list\",\"description\":\"Share work and pull context\\n\\nRead the contents of a Slack list including its column schema and records. Returns data as a markdown table (default) or CSV. The column headers are always part of the output (the table header in markdown, the first line in CSV). Each record row is prefixed with a \\\"Record ID\\\" column (the Rec… id); pass that value as record_id to slack_update_list_record to edit the row.\\n\\nProvide either list_id or list_title to identify the list. If both are given, list_id is tried first (an exact ID is unambiguous); if that ID does not resolve, the tool falls back to
      the list_title search and notes in the output that the provided ID was not used.\\n\\nArgs:\\n\\tlist_id (Optional[str]): The ID of the list to read (e.g., ''F0ABC123''). An exact, direct lookup — prefer this when known; it''s faster and unambiguous.\\n\\tlist_title (Optional[str]): The title of the list to read. Resolved via a fuzzy, relevance-ranked search (not an exact, case-sensitive match) — so it can be slower and less precise than list_id, may match several similarly-named lists, and may return a related list rather than an exact title match; the best match is used. Pass list_id to target a specific list among several with similar titles. If nothing matches, returns list_not_found.\\n\\tformat (Optional[str]): Output format - ''markdown'' (default) or ''csv''\\n\\tlimit (Optional[int]): Maximum number of records to return per page. Capped at 100 — larger values are clamped to 100, so reading more than 100 records requires paginating with cursor. Default: 100\\n\\tcursor (Optional[str]):
      Pagination cursor for fetching the next page of a multi-page read. Pass back the exact next_cursor string from a previous call''s output — it is an opaque token, so do not construct, parse, or modify it. Omit (or pass empty) to read from the first record.\\n\\tschema_only (Optional[bool]): When true, return only the column schema (names and types) and skip fetching records. Use this to answer \\\"what columns does this list have?\\\" without reading any rows. Default: false\\n\\nReturns:\\n\\tstr: List contents formatted as a markdown table or CSV data. When more records remain, the output includes a next_cursor to pass back in for the following page.\\n\\nExamples:\\n\\t- \\\"Read a list\\\" -> slack_read_list(list_id=''F0ABC123'')\\n\\t- \\\"Read a list by name\\\" -> slack_read_list(list_title=''Project Tracker'')\\n\\t- \\\"What columns does this list have?\\\" -> slack_read_list(list_id=''F0ABC123'', schema_only=true)\\n\\t- \\\"Export list as CSV\\\" -> slack_read_list(list_id=''F0ABC123'',
      format=''csv'')\\n\\t- \\\"Get first 10 rows\\\" -> slack_read_list(list_id=''F0ABC123'', limit=10)\\n\\t- \\\"Get the next page\\\" -> slack_read_list(list_id=''F0ABC123'', cursor=''<next_cursor from prior call>'')\\n\\nError Handling:\\n\\t- Returns error if neither list_id nor list_title is provided, or the list is not found\\n\\t- Returns error if user lacks access to the list\\n\\t- When list_title matches multiple lists, the best search match is read (no error); pass list_id to disambiguate\\n\\t- Returns \\\"invalid_cursor\\\" if the pagination cursor is malformed\\n\\t- Returns \\\"rate_limit_exceeded\\\" when too many reads are issued in a short window — back off, then retry\\n\\t- Returns \\\"feature_not_enabled\\\" if Slack lists are not available to this account — do not retry\\n\\t- Returns \\\"failure_fetching_records\\\" if the list could be read but came back malformed — retrying once is reasonable; treat a second occurrence as terminal\\n\\t- Other errors from the
      underlying record read surface as-is, e.g. \\\"missing_scope\\\" (the token lacks lists:read — do not retry) or \\\"internal_error\\\". Treat an unfamiliar code as terminal unless it names a rate limit.\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__slack_slack_read_list(args: {\\n  // Pagination cursor returned by a previous call as `next_cursor`. An opaque token — pass it back verbatim; do not construct or modify it. Omit to read from the first record.\\n  cursor?: string;\\n  // Output format: ''markdown'' (default) or ''csv''\\n  format?: \\\"markdown\\\" | \\\"csv\\\";\\n  // Maximum number of records to return. Default: 100\\n  limit?: number;\\n  // Link ID for the account this call should use. Supply link_id using a link_id value below. Select only from the accounts below. If multiple listed accounts could satisfy a write request and the intended account is not clear from the user''s request or conversation, ask which account to use before calling
      this tool.\\n  // [\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8bf582ee88191a8999a05c1170680\\\",\\n  // \\\"link_name\\\": \\\"HEP-Watts (Undergrads)\\\",\\n  // \\\"profile_id\\\": \\\"TB3SPQNQH:UB4DBQEP4\\\",\\n  // \\\"profile_name\\\": \\\"Gordon Watts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"TB3SPQNQH\\\",\\n  // \\\"profile_workspace_name\\\": \\\"HEP-Watts\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8be1b8a908191b09b9a7dcef4f239\\\",\\n  // \\\"link_name\\\": \\\"uw-teaching-team\\\",\\n  // \\\"profile_id\\\": \\\"T011H4V3RC6:U01HY74RW4U\\\",\\n  // \\\"profile_name\\\": \\\"Gordon Watts\\\",\\n  // \\\"profile_email\\\": \\\"gwatts@uw.edu\\\",\\n  // \\\"profile_workspace_id\\\": \\\"T011H4V3RC6\\\",\\n  // \\\"profile_workspace_name\\\": \\\"uw-phys-teaching-team\\\"\\n  // },\\n  // {\\n  // \\\"link_id\\\": \\\"link_6ad8bdfc3868819199deeb7c48f56213\\\",\\n  // \\\"link_name\\\": \\\"CLARIPHY\\\",\\n  //
