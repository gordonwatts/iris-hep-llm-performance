      Use after_block_id to insert, replace_block with its observed expected_hash to replace, or omit both to append. Library-backed Space Pages are supported. Only image-style embeds execute HTML/JavaScript in the viewer sandbox. Inspect the edit receipt. If an error includes visualization, reuse that uploaded file after checking the Page and file access; do not upload again. An unknown edit outcome requires readback before another edit. This tool is part of plugin `Pages`.\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__chatgpt_space_create_page_visualization(args: { after_block_id?: string | null; base_sequence?: number | null; html: string; page_id: string; replace_block?: { block_id: string; expected_hash: string; } | null; title: string; }): Promise<CallToolResult<{ edit: { error: { code: \\\"invalid_page_schema\\\"; commit_status: \\\"not_committed\\\"; message: string; }; } | {\\n  // Sequence assigned to this edit, when available.\\n  new_sequence?:
