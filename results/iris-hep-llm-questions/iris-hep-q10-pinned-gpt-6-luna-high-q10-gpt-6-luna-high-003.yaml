      is required. For inspection without an edit, use inspect_artifact; it needs no idempotency_key. By default, wait for persistence. Set wait_for_persistence to false to return after the realtime service accepts the edit; accepted does not mean saved. Use small edits. If result_omitted is true, inspect a smaller range in a new read-only callback. Do not repeat the edit to recover omitted data. Each call starts from current document state and submits its CRDT delta. Only committed confirms an edit was saved. After an accepted or uncertain response, call get_artifact_execution_status with the original page_id and idempotency_key. Do not repeat the edit with a new idempotency_key while its outcome is unknown. For rejected, follow error_message; retryable=true marks a definitive transient failure that may be retried once as directed. File exports are not supported. When this tool is available, always prefer it over the local codex_app/create_spaces_artifact tool. For the same page_id, issue
      only one inspect_artifact or execute_artifact_code call at a time. Wait for its response before starting another, including read-only inspections. Overlapping calls are rejected with artifact_worker_busy; they are not queued. This tool is part of plugin `Pages`.\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { mcp__codex_apps__chatgpt_space_execute_artifact_code(args: {\\n  // Async JavaScript callback of 1–65,536 characters receiving the document model and session. Read or edit the matching @oai/artifact-tool model. session provides snapshot metadata without browser selection or live updates. Return up to 16 KiB of JSON. Larger results are omitted without discarding the edit. In cloud tasks, shares the container with shell/code tools. Reuse files via Node fs, modules via imports, and binaries via child_process. The persistent Node worker cannot access other processes'' globals. Use absolute paths/file URLs; process.cwd() gives the working directory. Local desktop/executor
      files are unavailable. Spreadsheet callbacks receive `workbook`; e.g. async ({workbook}) => workbook.worksheets.add(''Sheet1''). Presentations receive `presentation`; e.g. async ({presentation}) => presentation.slides.add(). Canvas receives `whiteboard`; e.g. whiteboard.elements.items. Read the relevant spreadsheets, presentations, or canvas skill, if installed, for @oai/artifact-tool API usage. Use upload_artifact_images for new image sources, then slide.images.add({path: reference, ...}). Do not put bytes, blobs, base64, dataUrl values, or local paths in Artifact Tool image objects. You may edit and render in the same callback. For visual QA, await presentation.render({slide: index}) or workbook.render({sheetName, range, format: ''png''}). Render sequentially: up to 4 PNGs, 4 MiB combined per call; reduce the batch or render scale if needed. PNG bytes attach to successful responses. Each preview creates no Page or Library asset and is unavailable from later status lookups. Hydration
      may use temporary container cache files.\\n  code: string;\\n  // Optional absolute font file paths (.ttf/.otf) to load for rendering. Use after installing a font, or if it later stops rendering correctly. Directories and globs are not supported. Preserves loaded application fonts. If a file is missing, reinstall it first. Font-loading warnings do not stop the callback.\\n  font_files_to_load?: Array<string>;\\n  // Load image_references before rendering or reading image bytes. Omit for text/layout reads and edits. Works for inspection and editing, including edit then render.\\n  hydrate_images?: boolean;\\n  // Required idempotency key. Use a new key for each edit within this task. After an uncertain response, reuse the same key and edit arguments for a retry; use that key for status lookup.\\n  idempotency_key: string;\\n  // library-file:<resource-id> references to insert or hydrate; do not pass local paths or HTTP URLs. For slides, inspect without hydration: filter presentation.getPendingImageHydrationRequests()
      by slideIds matching presentation.slides.getItem(i).id (zero-based); return unique uri values. Includes backgrounds and inherited images. Set hydrate_images=true to load them; empty does not auto-select.\\n  image_references?: Array<string>;\\n  // Page ID of the target artifact, not the parent Page ID, and never a Space ID. For a URL, use only the ID in /space/{page_id}, without query parameters.\\n  page_id: string;\\n  // Wait for the edit to be saved before returning. Set false to return when the realtime service accepts the edit. An accepted result does not confirm persistence; use get_artifact_execution_status with the same page_id and idempotency_key to confirm it.\\n  wait_for_persistence?: boolean;\\n}): Promise<CallToolResult<{\\n  // Canonical sequence where this operation''s delta was saved.\\n  committed_sequence?: number | null;\\n  // Page document type, when known by the backend.\\n  document_type?: string | null;\\n  // Machine-readable failure or uncertainty code.\\n  error_code?:
      string | null;\\n  // Callback error name, message and callback-only stack locations. Available for code errors, not infrastructure failures. No edit was saved.\\n  error_details?: { category?: \\\"semantic\\\" | \\\"unknown\\\"; message: string; name: string; stack: Array<string>; truncated: boolean; } | null;\\n  // Safe explanation of the failure and any available recovery steps.\\n  error_message?: string | null;\\n  // Font loading only; status remains the edit outcome. Never repeat a saved edit to fix fonts. Not stored in the commit receipt.\\n  font_loading?: { error_details?: { category?: \\\"semantic\\\" | \\\"unknown\\\"; message: string; name: string; stack: Array<string>; truncated: boolean; } | null; message?: string | null; status: \\\"loaded\\\" | \\\"disabled\\\" | \\\"runtime_unsupported\\\" | \\\"memory_limit\\\" | \\\"registration_failed\\\"; } | null;\\n  // Original edit key. Reuse it for status lookup or retries in the same task.\\n  idempotency_key: string;\\n  //
