    in a PEP 723 block, and uses Typer for a future-proof CLI.\n\n## Workflow\n\n1. Gather requirements: script purpose, inputs/outputs, dependencies, and any file paths.\n2. Start from `assets/pep723_typer_script.py` and copy it into the target script.\n3. Update the PEP 723 block:\n   - Keep `requires-python = \">=3.13\"` as the default.\n   - List all dependencies, always include `typer`.\n4. Implement the logic inside the Typer command(s) and keep it single-file.\n5. Ensure the shebang is the very first line: `#!/usr/bin/env -S uv run --script`.\n6. Update the Typer command help string to describe what the script does.\n7. Mark the script executable after writing it (e.g., `chmod +x <script>`).\n8. Provide run instructions (`uv run --script script.py`).\n\n## Requirements\n\n- Always use Typer even if no arguments are currently needed.\n- Do not create a package layout or pyproject; keep everything in one script.\n- Keep the file ASCII unless the user explicitly needs Unicode.\n- Prefer
    small helper functions over complex classes unless necessary.\n\n## Assets\n\nUse `assets/pep723_typer_script.py` as the starting template for new scripts.\n---\nname: servicex\ndescription: Write and debug ServiceX queries in func_adl against ATLAS xAOD data (PHYSLITE/PHYS), including dataset selection, filtering, hosted delivery, and local WSL2 reproduction of failing transforms. Use when asked to build, edit, or debug ServiceX/func_adl queries, ATLAS xAOD skims, rucio dataset fetches, or ServiceX Local runs.\n---\n\n# ServiceX\n\n## Overview\n\nProvide concise, correct func_adl query patterns for ServiceX on ATLAS xAOD, with best practices for selections, outputs, and deliver usage.\n\n## Workflow\n\n1. Identify the dataset type and base query.\n   - Use `FuncADLQueryPHYSLITE` for PHYSLITE or OpenData.\n   - Use `FuncADLQueryPHYS` for PHYS or other derivations.\n   - For an unfamiliar object property or missing method, follow\n     `references/datamodel-xaod-discovery.md`: inspect
    the installed release-matched\n     Python stubs first, then the corresponding Athena headers if needed.\n2. Build a top-level `Select` that gathers all required collections and singletons.\n   - Apply object-level filters with nested `.Where` inside this `Select`.\n   - Do not pick columns yet.\n3. Apply event-level filtering with a top-level `.Where` after the collections `Select`.\n4. Create a final top-level `Select` that returns a single dictionary of output columns.\n   - Convert units to standard LHC units (GeV, meters, etc.).\n   - Never return a nested dictionary.\n5. Use `deliver` once with `NFiles=1` by default and appropriate dataset source(s).\n6. Make sure that the layout of the data that will be returned is remembered - downstream tasks that want to work with the data will need to understand it.\n\n## Core Rules\n\n- Prefer two top-level `Select` calls: collections first, output columns second.\n- Filter objects with nested `.Where`; filter events with a top-level `.Where`.\n-
    Use a single final `Select` that returns a dictionary of outputs.\n- Do not use `awkward` functions inside ServiceX queries.\n- Use `dataset.Rucio` for rucio DIDs and `dataset.FileList` for URL lists.\n- Always set `NFiles=1` by default.\n- For fetches where cache bypass matters, use `ignore_local_cache=True` in `deliver`.\n- If a hosted transform fails and its worker logs are required, respond with\n  `HELP USER`; for a local WSL2 run, inspect the generated `wsl_log.txt` as\n  described in `references/servicex-local-wsl2.md`.\n- Ensure `func_adl_servicex_xaodr25` is listed as a dependency in the active project and installed in the current virtual environment before running or generating code that uses it.\n- The suffix on the xAOD package selects the ATLAS software release: `func_adl_servicex_xaodr25` is for Release 25 and `func_adl_servicex_xaodr21` is for Release 21. Match the query package to the ServiceX xAOD backend/executor release; do not mix an r25 query package with an r21
    executor.\n- When using xAOD tool helpers, add `hep-llm-helpers>=1.0.0b1` to the active project; standalone PEP 723 scripts must list it in their dependency block, and imports use `hep_llm_helpers.xaod_hints`.\n- When defining an xAOD accessor, the Python variable assigned by `make_tool_accessor` must exactly match its `function_name` (for example, `tag_weight = make_tool_accessor(..., function_name=\"tag_weight\", ...)`); use that same name in the later query. A mismatch causes an unknown-type translation error.\n- In standalone-script metadata, declare `jinja2` explicitly if the environment requires it for `func_adl_servicex_xaodr25` usage.\n- When a hosted xAOD transform fails and its worker log is unavailable, use the\n  local WSL2 procedure in `references/servicex-local-wsl2.md` before changing\n  the query. Keep its generated code, logs, caches, downloaded files, and\n  outputs outside the repository.\n\n## References\n\n- Load `references/servicex-hints.md` for overall ServiceX
    query patterns, synchronous delivery patterns, best practices, and error handling.\n- Load `references/servicex-async-hints.md` only when async behavior is explicitly requested (`deliver_async`, async timeout handling, or version-compat async behavior).\n- Load `references/servicex-local-wsl2.md` when reproducing a failing ATLAS\n  PHYSLITE transform locally on Windows with `servicex-local` and WSL2.\n- Load only the relevant xAOD data model topic file(s) to keep context small. Naming convention: `references/datamodel-xaod-*.md`.\n- Load [xAOD accessor discovery](references/datamodel-xaod-discovery.md) for\n  unfamiliar quantities, enum arguments, auxiliary attributes, or C++ methods\n  absent from the Python stubs. It includes a small C++ callable pattern.\n- xAOD topics:\n  - `references/datamodel-xaod-units.md` (standard ATLAS units (energy, etc))\n  - `references/datamodel-xaod-objects.md` (jets, electrons, muons)\n  - `references/datamodel-xaod-tau.md`\n  - `references/datamodel-xaod-missing-et.md`\n  -
    `references/datamodel-xaod-tools-btagging.md`\n  - `references/datamodel-xaod-triggers.md` (event decisions and a matching-format decision table; start here for trigger queries)\n  - `references/datamodel-xaod-event-weights.md`\n  - `references/datamodel-xaod-tlorentzvector.md`\n\nFor triggers, load only the recipe needed after choosing the operation:\n\n- Fired chain names: [name discovery](references/datamodel-xaod-trigger-names.md).\n- Precomputed `TrigMatch_` / `AnalysisTrigMatch_` composites: [Run 2 matching](references/datamodel-xaod-trigger-matching-run2.md).\n- `HLTNav_Summary_*` navigation: [Run 3 matching](references/datamodel-xaod-trigger-matching-run3.md).\n- Data-trigger recommendations, GRLs, or prescales: [trigger selection](references/datamodel-xaod-trigger-selection.md).\n./servicex.yaml\n","exit_code":0,"status":"completed"}}

    {"type":"item.started","item":{"id":"item_2","type":"command_execution","command":"/bin/bash -lc ''cat /home/gwatts/llms-test/test-wsl2-llm-HasygVzm/.harness/codex-home/plugins/cache/iris-hep-tools/iris-hep/1.0.0-RC.3/skills/servicex/references/servicex-hints.md && cat /home/gwatts/llms-test/test-wsl2-llm-HasygVzm/.harness/codex-home/plugins/cache/iris-hep-tools/iris-hep/1.0.0-RC.3/skills/standalone-script/assets/pep723_typer_script.py && cat servicex.yaml && pwd''","aggregated_output":"","exit_code":null,"status":"in_progress"}}

    {"type":"item.completed","item":{"id":"item_2","type":"command_execution","command":"/bin/bash -lc ''cat /home/gwatts/llms-test/test-wsl2-llm-HasygVzm/.harness/codex-home/plugins/cache/iris-hep-tools/iris-hep/1.0.0-RC.3/skills/servicex/references/servicex-hints.md && cat /home/gwatts/llms-test/test-wsl2-llm-HasygVzm/.harness/codex-home/plugins/cache/iris-hep-tools/iris-hep/1.0.0-RC.3/skills/standalone-script/assets/pep723_typer_script.py && cat servicex.yaml && pwd''","aggregated_output":"# ServiceX FuncADL xAOD Code Snippets\n\nUse ServiceX to fetch data from `rucio` datasets on the GRID, skimming out only the data required from the events needed.\n\nBest practice (details below):\n\n1. Define your `base_query`\n2. Select the collections you need (jets, electrons)\n\n    - This should be a top level `Select`\n    - Select all the collections you need - do not make separate queries.\n    - Include singletons (like met or EventInfo) - you have to extract them at this level to use later.\n    -
    Apply selections at the object level if need be (using a nested `.Where`). This is important as it can dramatically reduce the amount of data that needs to be shipped out of ServiceX.\n    - Do not select the columns (like pt, eta, etc.) at this stage. Do that at the next stage.\n\n3. Apply any event level selections needed\n\n    - Use a top level `.Where` to do this.\n    - For example, only events with at least 2 jets.\n    - This is important as it can dramatically reduce the amount of data that needs to be shipped out of ServiceX.\n    - You can''t go back to the root event object from step 2 here - you can only reference what you defined in step 2.\n\n4. Select the items from the collections that need to be sent to the client. The jet pT or eta, MET.\n\n    - At this point the `Select` statement is over the dictionary of collections you built in step 2.\n    - And scale to the proper units (GeV, etc.).\n    - The final `Select` must be a single outer level `Select` with a dictionary
    as its result.\n\n5. Execute the query to fetch the data.\n\nNotes:\n\n- Quantities returned from servicex should be in units most people use at the LHC - GeV, meters, etc. Please convert from whatever the units of the input files are in.\n- NEVER nest a dictionary inside another dictionary. That will for sure cause a servicex crash.\n\n## A Simple Full Example\n\nThis example fetches the jet $p_T$''s from a PHYSLITE formatted xAOD data sample stored by `rucio`.\n\n```python\nfrom func_adl_servicex_xaodr25 import FuncADLQueryPHYSLITE\nfrom servicex import deliver, ServiceXSpec, Sample, dataset\n\n# The base query should run against PHYSLITE.\nbase_query = FuncADLQueryPHYSLITE()\n\n# Query: get all jet pT\njet_pts_query = (base_query\n    .Select(lambda evt: {\"jets\": evt.Jets()})\n    .Select(lambda collections: collections.jets.Select(lambda jet:\n    {\n        \"jet_pt\": jet.pt() / 1000.0,\n    })\n)\n\n# Do the fetch\n# Define the rucio dataset identifier (DID).\nds_name = (\"mc23_13p6TeV:mc23_13p6TeV.801167.Py8EG_A14NNPDF23LO_jj_JZ2.deriv.DAOD_PHYSLITE.e8514_e8528_a911_s4114_r15224_r15225_p6697\")\n\nall_jet_pts_delivered
    = deliver(\n    ServiceXSpec(\n        Sample=[\n            Sample(\n                Name=\"jet_pt_fetch\",\n                Dataset=dataset.Rucio(ds_name),\n                NFiles=1,\n                Query=jet_pts_query,\n            )\n        ]\n    ),\n)\n```\n\n- `all_jet_pts_delivered` is a dictionary indexed by sample name. It contains a list of paths to ROOT files (in the form of a `GuardList`). For `NFiles=1`, there will be only a single file.\n  - If it makes sense in the code, add a command line option, or a default option to the function you are working on to change NFiles (e.g. `--n-files` with alias `-n`). It should default to 1, and `None` would be all files in the dataset. For the command line, `0` would represent all files. The user may already have some code that deals with this - in which case use that infrastructure.\n\n## The `deliver` function\n\n- Default to `NFiles=1` because large datasets can take a lot of time. While adding a command line option to change
    it is fine, defaulting to the full dataset is not - until the user has done sufficient testing.\n- The query can be re-used.\n- Use `dataset.Rucio` for a `rucio` dataset, use `dataset.FileList` for a list of web accessible datasets (via `https` or `xrootd://`)\n- Only call deliver once - make sure all the data you want is in the query, even if multiple samples - just add more to the `Sample` array.\n- If cache bypass is requested or needed for stress/repeat testing, set `ignore_local_cache=True` (argument to the `deliver` function).\n\nThere are two ways to access the output of the `deliver` function.\n\n1. If the output is small enough you expect to be able to run in-memory. For quick studies, etc., this works very well and is quite easy.\n\n  a. Make sure the `servicex_analysis_utilities` package is included in the project''s dependencies.\n  b. The following code will turn the output above into a single awkward array:\n\n  ```python\n  from servicex_analysis_utils import to_awk\n\n  all_jets_pts_awk
    = to_awk(all_jet_pts_delivered)\n  jet_pts = all_jets_pts_awk[\"jet_pt_fetch\"]\n  ```\n\n1. Use the ROOT files directly. These can be used with RDataFrame or `uproot`. If you have to deal with a very large amount of data that won''t fit in memory, this is the proper approach.\n\n    a. The following code gets a list of all the ROOT files (if `NFiles==1` then there will be only one).\n\n    ```python\n    file_list = [str(p) for p in all_jet_pts_delivered[''jet_pt_fetch'']\n    ```\n\n## Base Query\n\nQueries have to start from a base, like `FuncADLQueryPHYSLITE`.\n\n- Assume all queries are on Release 25 datasets (the `func_adl_servicex_xaodr25` package)\n- Use `FuncADLQueryPHYSLITE` for ATLAS PHYSLITE samples - that have already had calibrations, etc., applied.\n- Use `FuncADLQueryPHYS` for ATLAS PHYS or other derivations (like LLP1, etc.). These aren''t calibrated, so this will try to run calibrations.\n\nThe `base_query` is a sequence of events. Each event contains collections of
    objects like Jets and Electrons. `evt.Jets()` gets you the collection of jets for a particular event. You can pass `calibrated=False` to prevent calibration in `PHYS`, but note that `PHYSLITE` does not have uncalibrated jets (or other objects) in it! This `func_adl` language is based on LINQ.\n\n`ServiceX` queries can not contain references to `awkward` functions. Instead, use `Select`, `Where`, to effect the same operations.\n\nTo tell what kind of data you are looking at, scan the name of the dataset:\n\n- If it has PHYSLITE in it, it is PHYSLITE.\n- If it has DAOD_PHYS in it, it is PHYS.\n- If it is OpenData, then it is PHYSLITE. It usually has OpenData in the name somewhere. There are a few differences in how you code against OpenData - look carefully at the instructions.\n\n## Filtering in a Query\n\nUse the `Where` operator to filter objects by a condition, and replace the above nested `Select` (the `jets.Select(lambda jet:`) with a `.Where(lambda jet: jet.pt()/1000.0 > 200.)`.
    You can have a complex expression and can use `and` and `or` from python operators. You can also have a sequence of `.Where` statements chained.\n\nYou can also filter events by putting a `.Where` at the top level. Here is an example that looks for at least 2 jets with a pT cut:\n\n```python\nquery = (FuncADLQueryPHYSLITE()\n    .Where(lambda e: e.Jets()\n                      .Where(lambda j: j.pt() / 1000.0 > 30.0)\n                      .Count() >= 2)\n    .Select(lambda e: {''NumJets'': e.Jets().Count()})\n)\n```\n\n## Multiple Object Collections\n\nFuncADL queries can return multiple collections simultaneously (e.g. electrons and muons). The best practice it to chain two top level `Select` statements. The first selects the required collections and applies any top level selections to those object. The second builds the return data and any necessary calculations.\n\n```python\nquery = (FuncADLQueryPHYSLITE()\n    .Select(lambda e: {\n        ''ele'': e.Electrons().Select(lambda e:
    e.pt()/1000 > 30), \n        ''mu'': e.Muons().Select(lambda m: abs(m.eta()) < 2.5)\n    }))\n    .Select(lambda pairs: {\n        ''ele_pt'':  pairs.ele.Select(lambda ele: ele.pt()/1000),\n        ''ele_eta'': pairs.ele.Select(lambda ele: ele.eta())\n        ''mu_pt'': pairs.mu.Select(lambda mu: mu.pt()/1000),\n        ''mu_eta'': pairs.mu.Select(lambda mu: mu.eta())\n    })\n```\n\nNote:\n\n- Any collations or items you want to access in the second select statement must be passed through from the first.\n\n## Errors\n\nIf you encounter an error after running, there are two types. The first give you type errors, and those you can solve just by reading the error message carefully and perhaps not doing whatever the code complained about. You might have to look carefully for this message - for example \"Method xxx not found on object.\"\n\nThe second type of error there isn''t much you can do to get more information, however. You''ll find an error that looks like \"Transform \"xxx\" completed
    with failures.\" And something in `stdout` about clicking on `HERE` to get more information. Sadly, only the requester can do that. If that happens just reply with \"HELP USER\" and that will be a signal. Note that you might get an error as mentioned above and this - in which case try to solve the error before getting the user involved. A common case here is you request some data that should be in the datafiles, but is not.\n\n## Dependency caveat\n\n- Ensure `func_adl_servicex_xaodr25` is installed and importable in the active environment.\n- In standalone scripts using inline metadata, include `jinja2` explicitly if imports/runtime require it.\n#!/usr/bin/env -S uv run --script\n# NOTE: Be careful editing this block; requires-python and dependencies control uv/PEP 723 execution.\n# /// script\n# requires-python = \">=3.13\"\n# dependencies = [\n#   \"typer>=0.12\",\n# ]\n# ///\nimport logging\n\nimport typer\n\napp = typer.Typer(add_completion=False)\n\n\n@app.command()\ndef main(verbose:
    int = typer.Option(0, \"-v\", \"--verbose\", count=True)) -> None:\n    \"\"\"Describe what the script does.\"\"\"\n    log_level = logging.WARNING\n    if verbose == 1:\n        log_level = logging.INFO\n    elif verbose >= 2:\n        log_level = logging.DEBUG\n    logging.basicConfig(level=log_level, format=\"%(levelname)s: %(message)s\")\n    typer.echo(\"Hello from Typer.\")\n\n\nif __name__ == \"__main__\":\n    app()\napi_endpoints:\n  - name: servicex\n    endpoint: https://servicex.af.uchicago.edu/\n    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmcmVzaCI6ZmFsc2UsImlhdCI6MTc0MjI4MTc1MiwianRpIjoiOGE2ZmM1NzUtNGYxMC00YWFhLTg0ZGUtYjI2ZmJhNWEyNmE1IiwidHlwZSI6InJlZnJlc2giLCJzdWIiOiJnd2F0dHNAdXcuZWR1IiwibmJmIjoxNzQyMjgxNzUyLCJjc3JmIjoiZjU2N2UzYzMtOTRmYi00YWM5LTkyYWMtMmIxMDBiY2FjZjRlIn0.lzJt72Lsjlgdl2M0OUc1zwUXFIH4cGB9X1wBh5KB4Qk\ndefault_endpoint: servicex\n/home/gwatts/llms-test/test-wsl2-llm-HasygVzm/workspace\n","exit_code":0,"status":"completed"}}

