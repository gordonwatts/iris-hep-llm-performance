      idempotency_key as error_message directs; an unknown outcome instead requires status lookup.\\n  retryable?: boolean;\\n  // committed confirms a saved edit. accepted means the realtime service accepted the edit for persistence, but it is not yet confirmed saved. no_changes means no delta was produced. rejected means the edit was not saved. unknown means the outcome is uncertain. not_found means no operation was recorded for this request ID.\\n  status: \\\"committed\\\" | \\\"accepted\\\" | \\\"no_changes\\\" | \\\"rejected\\\" | \\\"unknown\\\" | \\\"not_found\\\";\\n} | {\\n  // Connector failure envelope, distinct from a completed backend execution.\\n  error: { code?: string | null; commit_status?: string | null; message: …106744 tokens truncated…fl\\\"}, {\\\"fn\\\":\\\"schedule\\\",\\\"league\\\":\\\"nba\\\",\\\"team\\\":\\\"GSW\\\",\\\"date_from\\\":\\\"2025-02-24\\\"}]}\\n* `time`: {\\\"time\\\":[{\\\"utc_offset\\\":\\\"+03:00\\\"}]}\\n\\n---\\n\\n## Usage hints\\nTo use this
      tool efficiently:\\n* Use multiple commands and queries in one call to get more results faster; e.g. {\\\"search_query\\\": [{\\\"q\\\": \\\"bitcoin news\\\"}], \\\"finance\\\":[{\\\"ticker\\\":\\\"BTC\\\",\\\"type\\\":\\\"crypto\\\",\\\"market\\\":\\\"\\\"}], \\\"find\\\": [{\\\"ref_id\\\": \\\"turn0search0\\\", \\\"pattern\\\": \\\"Annie Case\\\"}, {\\\"ref_id\\\": \\\"turn0search1\\\", \\\"pattern\\\": \\\"John Smith\\\"}]}\\n* Use \\\"response_length\\\" to control the number of results returned by this tool, omit it if you intend to pass \\\"short\\\" in\\n* Only write required parameters; do not write empty lists or nulls where they could be omitted.\\n* `search_query` must have length at most 4 in each call. If it has length > 3, response_length must be medium or long\\n* If you find yourself in a situation where you accidentally call the `web.run` tool, it''s best just to send an empty query: {\\\"search_query\\\": [{\\\"q\\\": \\\"\\\"}]}.\\n\\n---\\n\\n## Decision boundary\\n\\nIf
      the user makes an explicit request to search the internet, find latest information, look up, etc (or to not do so), you must obey their request.\\nWhen you make an assumption, always consider whether it is temporally stable; i.e. whether there''s even a small (>10%) chance it has changed. If it is unstable, you must verify with browsing the internet for verification.\\n\\n<situations_where_you_must_browse_the_internet>\\nBelow is a list of scenarios where browsing the internet MUST be used. PAY CLOSE ATTENTION: you MUST browse the internet in these cases. If you''re unsure or on the fence, you MUST bias towards browsing the internet.\\n- The information could have changed recently: for example news; prices; laws; schedules; product specs; sports scores; economic indicators; political/public/company figures (e.g. the question relates to ''the president of country A'' or ''the CEO of company B'', which might change over time); rules; regulations; standards; software libraries that could
      be updated; exchange rates; recommendations (i.e., recommendations about various topics or things might be informed by what currently exists / is popular / is safe / is unsafe / is in the zeitgeist / etc.); and many many many more categories -- again, if you''re on the fence, you MUST browse the internet!\\n  - For news queries, prioritize more recent events, ensuring you compare publish dates and the date that the event happened.\\n- The user is seeking recommendations that could lead them to spend substantial time or money -- researching products, restaurants, travel plans, etc.\\n- The user wants (or would benefit from) direct quotes, links, or precise source attribution.\\n- A specific page, paper, dataset, PDF, or site is referenced and you haven''t been given its contents.\\n- You''re unsure about a fact, the topic is niche or emerging, or you suspect there''s at least a 10% chance you will incorrectly recall it\\n- High-stakes accuracy matters (medical, legal, financial guidance).
      For these you generally should search by default because this information is highly temporally unstable\\n- The user explicitly says to search, browse, verify, or look it up.\\n</situations_where_you_must_browse_the_internet>\\n\\n---\\n\\n## Citations\\n\\nResults from `web.run` include internal reference IDs such as `turn2search5`. Use\\nthose reference IDs only in calls to `web.run`; do not expose them in the final\\nresponse.\\n\\nCite sources in the final response using Markdown links:\\n\\n- Cite a single source as `[descriptive source title](https://example.com/page)`.\\n- Cite multiple sources with separate Markdown links, for example\\n  `[first source](https://example.com/one), [second source](https://example.com/two)`.\\n- Link directly to the page that supports the claim. Do not link to search result\\n  pages or use bare URLs.\\n\\nFormatting of citations:\\n\\n- Place each citation as near as possible to the claim it supports, normally at\\n  the end of the sentence or
      paragraph and after punctuation.\\n- Do not place citations inside code fences.\\n- Do not put citations on a line by themselves or collect all citations at the\\n  end of the response.\\n\\nIf you browse the internet, cite statements supported by web sources. Each cited\\nsource must directly support the associated claim. Prefer primary and\\nauthoritative sources, and use sources from different domains when the response\\nbenefits from multiple perspectives.\\n\\n---\\n\\n## Special cases\\nIf these conflict with any other instructions, these should take precedence.\\n\\n<special_cases>\\n- When the user asks for information about how to use OpenAI products, (ChatGPT, the OpenAI API, etc.), you should check the code in local env and only browse as fallback, when you browse restrict your sources to official OpenAI websites using the domains filter, unless otherwise requested.\\n- When using search to answer technical questions, you must only rely on primary sources (research papers,
      official documentation, etc.)\\n- Clearly indicate when you are making an inference from sources.\\n</special_cases>\\n\\n---\\n\\n## Word limits\\nResponses may not excessively quote or draw on a specific source. There are several limits here:\\n- **Limit on verbatim quotes:**\\n  - You may not quote more than 25 words verbatim from any single non-lyrical source, unless the source is reddit.\\n  - For song lyrics, verbatim quotes must be limited to at most 10 words.\\n  - Long quotes from reddit are allowed, as long as you indicate that those are direct quotes via a markdown blockquote starting with \\\">\\\", copy verbatim, and link the source.\\n- **Word limits:**\\n  - Each webpage source in the sources has a word limit label formatted like \\\"[wordlim N]\\\", in which N is the maximum number of words in the whole response that are attributed to that source. If omitted, the word limit is 200 words.\\n  - Non-contiguous words derived from a given source must be counted to the word
      limit.\\n  - The summarization limit N is a maximum for each source.\\n  - When using multiple sources, their summarization limits add together. However, each article used must be relevant to the response.\\n- **Copyright compliance:**\\n  - You must avoid providing full articles, long verbatim passages, or extensive direct quotes due to copyright concerns.\\n  - If the user asked for a verbatim quote, the response should provide a short compliant excerpt and then answer with paraphrases and summaries.\\n  - Again, this limit does not apply to reddit content, as long as it''s appropriately indicated that those are direct quotes and you link to the source.\\n\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { web__run(args: {\\n  // Open links from previously opened pages.\\n  click?: Array<{\\n  // Numbered link id to open.\\n  id: number;\\n  // Reference id containing the numbered link.\\n  ref_id: string;\\n}>;\\n  // Look up prices for the given stock symbols.\\n  finance?:
      Array<{\\n  // ISO 3166-1 alpha-3 country code, \\\"OTC\\\", or \\\"\\\" for cryptocurrency.\\n  market?: string;\\n  // Ticker symbol to look up.\\n  ticker: string;\\n  // Asset type to look up.\\n  type: \\\"equity\\\" | \\\"fund\\\" | \\\"crypto\\\" | \\\"index\\\";\\n}>;\\n  // Find text patterns in pages.\\n  find?: Array<{\\n  // Text pattern to find.\\n  pattern: string;\\n  // Reference id or URL to search within.\\n  ref_id: string;\\n}>;\\n  // Query the image search engine for a given list of queries.\\n  image_query?: Array<{\\n  // Whether to filter by a specific list of domains.\\n  domains?: Array<string>;\\n  // Search query.\\n  q: string;\\n  // Whether to filter by recency, as a number of recent days.\\n  recency?: number;\\n}>;\\n  // Open pages by reference id or URL.\\n  open?: Array<{\\n  // Line number to position the page at.\\n  lineno?: number;\\n  // Reference id or URL to open.\\n  ref_id: string;\\n}>;\\n  // Set the length of the response to be returned.\\n  response_length?:
      \\\"short\\\" | \\\"medium\\\" | \\\"long\\\";\\n  // Take screenshots of PDF pages.\\n  screenshot?: Array<{\\n  // Zero-indexed PDF page number.\\n  pageno: number;\\n  // Reference id or URL to screenshot.\\n  ref_id: string;\\n}>;\\n  // Query the internet search engine for a given list of queries.\\n  search_query?: Array<{\\n  // Whether to filter by a specific list of domains.\\n  domains?: Array<string>;\\n  // Search query.\\n  q: string;\\n  // Whether to filter by recency, as a number of recent days.\\n  recency?: number;\\n}>;\\n  // Look up sports schedules and standings.\\n  sports?: Array<{\\n  // Start date in YYYY-MM-DD format.\\n  date_from?: string;\\n  // End date in YYYY-MM-DD format.\\n  date_to?: string;\\n  // Sports function to call.\\n  fn: \\\"schedule\\\" | \\\"standings\\\";\\n  // League to look up.\\n  league: \\\"nba\\\" | \\\"wnba\\\" | \\\"nfl\\\" | \\\"nhl\\\" | \\\"mlb\\\" | \\\"epl\\\" | \\\"ncaamb\\\" | \\\"ncaawb\\\" | \\\"ipl\\\";\\n  // Locale
      for the lookup.\\n  locale?: string;\\n  // Number of games to return.\\n  num_games?: number;\\n  // Opponent to use with `team` when narrowing the lookup.\\n  opponent?: string;\\n  // Team to look up, using the common 3 or 4 letter alias used in broadcasts.\\n  team?: string;\\n  // Tool name for sports requests.\\n  tool?: \\\"sports\\\";\\n}>;\\n  // Get time for the given UTC offsets.\\n  time?: Array<{\\n  // UTC offset formatted like \\\"+03:00\\\".\\n  utc_offset: string;\\n}>;\\n  // Look up weather forecasts.\\n  weather?: Array<{\\n  // Number of days to return. Defaults to 7.\\n  duration?: number;\\n  // Location in \\\"Country, Area, City\\\" format.\\n  location: string;\\n  // Start date in YYYY-MM-DD format. Defaults to today.\\n  start?: string;\\n}>;\\n}): Promise<unknown>; };\\n```\"}]\n# ServiceX FuncADL xAOD Code Snippets\n\nUse ServiceX to fetch data from `rucio` datasets on the GRID, skimming out only the data required from the events needed.\n\nBest practice
      (details below):\n\n1. Define your `base_query`\n2. Select the collections you need (jets, electrons)\n\n    - This should be a top level `Select`\n    - Select all the collections you need - do not make separate queries.\n    - Include singletons (like met or EventInfo) - you have to extract them at this level to use later.\n    - Apply selections at the object level if need be (using a nested `.Where`). This is important as it can dramatically reduce the amount of data that needs to be shipped out of ServiceX.\n    - Do not select the columns (like pt, eta, etc.) at this stage. Do that at the next stage.\n\n3. Apply any event level selections needed\n\n    - Use a top level `.Where` to do this.\n    - For example, only events with at least 2 jets.\n    - This is important as it can dramatically reduce the amount of data that needs to be shipped out of ServiceX.\n    - You can''t go back to the root event object from step 2 here - you can only reference what you defined in step 2.\n\n4.
      Select the items from the collections that need to be sent to the client. The jet pT or eta, MET.\n\n    - At this point the `Select` statement is over the dictionary of collections you built in step 2.\n    - And scale to the proper units (GeV, etc.).\n    - The final `Select` must be a single outer level `Select` with a dictionary as its result.\n\n5. Execute the query to fetch the data.\n\nNotes:\n\n- Quantities returned from servicex should be in units most people use at the LHC - GeV, meters, etc. Please convert from whatever the units of the input files are in.\n- NEVER nest a dictionary inside another dictionary. That will for sure cause a servicex crash.\n\n## A Simple Full Example\n\nThis example fetches the jet $p_T$''s from a PHYSLITE formatted xAOD data sample stored by `rucio`.\n\n```python\nfrom func_adl_servicex_xaodr25 import FuncADLQueryPHYSLITE\nfrom servicex import deliver, ServiceXSpec, Sample, dataset\n\n# The base query should run against PHYSLITE.\nbase_query
      = FuncADLQueryPHYSLITE()\n\n# Query: get all jet pT\njet_pts_query = (base_query\n    .Select(lambda evt: {\"jets\": evt.Jets()})\n    .Select(lambda collections: collections.jets.Select(lambda jet:\n    {\n        \"jet_pt\": jet.pt() / 1000.0,\n    })\n)\n\n# Do the fetch\n# Define the rucio dataset identifier (DID).\nds_name = (\"mc23_13p6TeV:mc23_13p6TeV.801167.Py8EG_A14NNPDF23LO_jj_JZ2.deriv.DAOD_PHYSLITE.e8514_e8528_a911_s4114_r15224_r15225_p6697\")\n\nall_jet_pts_delivered = deliver(\n    ServiceXSpec(\n        Sample=[\n            Sample(\n                Name=\"jet_pt_fetch\",\n                Dataset=dataset.Rucio(ds_name),\n                NFiles=1,\n                Query=jet_pts_query,\n            )\n        ]\n    ),\n)\n```\n\n- `all_jet_pts_delivered` is a dictionary indexed by sample name. It contains a list of paths to ROOT files (in the form of a `GuardList`). For `NFiles=1`, there will be only a single file.\n  - If it makes sense in the code, add a command line
      option, or a default option to the function you are working on to change NFiles (e.g. `--n-files` with alias `-n`). It should default to 1, and `None` would be all files in the dataset. For the command line, `0` would represent all files. The user may already have some code that deals with this - in which case use that infrastructure.\n\n## The `deliver` function\n\n- Default to `NFiles=1` because large datasets can take a lot of time. While adding a command line option to change it is fine, defaulting to the full dataset is not - until the user has done sufficient testing.\n- The query can be re-used.\n- Use `dataset.Rucio` for a `rucio` dataset, use `dataset.FileList` for a list of web accessible datasets (via `https` or `xrootd://`)\n- Only call deliver once - make sure all the data you want is in the query, even if multiple samples - just add more to the `Sample` array.\n- If cache bypass is requested or needed for stress/repeat testing, set `ignore_local_cache=True` (argument
      to the `deliver` function).\n\nThere are two ways to access the output of the `deliver` function.\n\n1. If the output is small enough you expect to be able to run in-memory. For quick studies, etc., this works very well and is quite easy.\n\n  a. Make sure the `servicex_analysis_utilities` package is included in the project''s dependencies.\n  b. The following code will turn the output above into a single awkward array:\n\n  ```python\n  from servicex_analysis_utils import to_awk\n\n  all_jets_pts_awk = to_awk(all_jet_pts_delivered)\n  jet_pts = all_jets_pts_awk[\"jet_pt_fetch\"]\n  ```\n\n1. Use the ROOT files directly. These can be used with RDataFrame or `uproot`. If you have to deal with a very large amount of data that won''t fit in memory, this is the proper approach.\n\n    a. The following code gets a list of all the ROOT files (if `NFiles==1` then there will be only one).\n\n    ```python\n    file_list = [str(p) for p in all_jet_pts_delivered[''jet_pt_fetch'']\n    ```\n\n##
      Base Query\n\nQueries have to start from a base, like `FuncADLQueryPHYSLITE`.\n\n- Assume all queries are on Release 25 datasets (the `func_adl_servicex_xaodr25` package)\n- Use `FuncADLQueryPHYSLITE` for ATLAS PHYSLITE samples - that have already had calibrations, etc., applied.\n- Use `FuncADLQueryPHYS` for ATLAS PHYS or other derivations (like LLP1, etc.). These aren''t calibrated, so this will try to run calibrations.\n\nThe `base_query` is a sequence of events. Each event contains collections of objects like Jets and Electrons. `evt.Jets()` gets you the collection of jets for a particular event. You can pass `calibrated=False` to prevent calibration in `PHYS`, but note that `PHYSLITE` does not have uncalibrated jets (or other objects) in it! This `func_adl` language is based on LINQ.\n\n`ServiceX` queries can not contain references to `awkward` functions. Instead, use `Select`, `Where`, to effect the same operations.\n\nTo tell what kind of data you are looking at, scan the name
      of the dataset:\n\n- If it has PHYSLITE in it, it is PHYSLITE.\n- If it has DAOD_PHYS in it, it is PHYS.\n- If it is OpenData, then it is PHYSLITE. It usually has OpenData in the name somewhere. There are a few differences in how you code against OpenData - look carefully at the instructions.\n\n## Filtering in a Query\n\nUse the `Where` operator to filter objects by a condition, and replace the above nested `Select` (the `jets.Select(lambda jet:`) with a `.Where(lambda jet: jet.pt()/1000.0 > 200.)`. You can have a complex expression and can use `and` and `or` from python operators. You can also have a sequence of `.Where` statements chained.\n\nYou can also filter events by putting a `.Where` at the top level. Here is an example that looks for at least 2 jets with a pT cut:\n\n```python\nquery = (FuncADLQueryPHYSLITE()\n    .Where(lambda e: e.Jets()\n                      .Where(lambda j: j.pt() / 1000.0 > 30.0)\n                      .Count() >= 2)\n    .Select(lambda e: {''NumJets'':
      e.Jets().Count()})\n)\n```\n\n## Multiple Object Collections\n\nFuncADL queries can return multiple collections simultaneously (e.g. electrons and muons). The best practice it to chain two top level `Select` statements. The first selects the required collections and applies any top level selections to those object. The second builds the return data and any necessary calculations.\n\n```python\nquery = (FuncADLQueryPHYSLITE()\n    .Select(lambda e: {\n        ''ele'': e.Electrons().Select(lambda e: e.pt()/1000 > 30), \n        ''mu'': e.Muons().Select(lambda m: abs(m.eta()) < 2.5)\n    }))\n    .Select(lambda pairs: {\n        ''ele_pt'':  pairs.ele.Select(lambda ele: ele.pt()/1000),\n        ''ele_eta'': pairs.ele.Select(lambda ele: ele.eta())\n        ''mu_pt'': pairs.mu.Select(lambda mu: mu.pt()/1000),\n        ''mu_eta'': pairs.mu.Select(lambda mu: mu.eta())\n    })\n```\n\nNote:\n\n- Any collations or items you want to access in the second select statement must be passed through
      from the first.\n\n## Errors\n\nIf you encounter an error after running, there are two types. The first give you type errors, and those you can solve just by reading the error message carefully and perhaps not doing whatever the code complained about. You might have to look carefully for this message - for example \"Method xxx not found on object.\"\n\nThe second type of error there isn''t much you can do to get more information, however. You''ll find an error that looks like \"Transform \"xxx\" completed with failures.\" And something in `stdout` about clicking on `HERE` to get more information. Sadly, only the requester can do that. If that happens just reply with \"HELP USER\" and that will be a signal. Note that you might get an error as mentioned above and this - in which case try to solve the error before getting the user involved. A common case here is you request some data that should be in the datafiles, but is not.\n\n## Dependency caveat\n\n- Ensure `func_adl_servicex_xaodr25`
      is installed and importable in the active environment.\n- In standalone scripts using inline metadata, include `jinja2` explicitly if imports/runtime require it.\n#!/usr/bin/env -S uv run --script\n# NOTE: Be careful editing this block; requires-python and dependencies control uv/PEP 723 execution.\n# /// script\n# requires-python = \">=3.13\"\n# dependencies = [\n#   \"typer>=0.12\",\n# ]\n# ///\nimport logging\n\nimport typer\n\napp = typer.Typer(add_completion=False)\n\n\n@app.command()\ndef main(verbose: int = typer.Option(0, \"-v\", \"--verbose\", count=True)) -> None:\n    \"\"\"Describe what the script does.\"\"\"\n    log_level = logging.WARNING\n    if verbose == 1:\n        log_level = logging.INFO\n    elif verbose >= 2:\n        log_level = logging.DEBUG\n    logging.basicConfig(level=log_level, format=\"%(levelname)s: %(message)s\")\n    typer.echo(\"Hello from Typer.\")\n\n\nif __name__ == \"__main__\":\n    app()\napi_endpoints:\n  - name: servicex\n    endpoint: https://servicex.af.uchicago.edu/\n    token:
      eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmcmVzaCI6ZmFsc2UsImlhdCI6MTc0MjI4MTc1MiwianRpIjoiOGE2ZmM1NzUtNGYxMC00YWFhLTg0ZGUtYjI2ZmJhNWEyNmE1IiwidHlwZSI6InJlZnJlc2giLCJzdWIiOiJnd2F0dHNAdXcuZWR1IiwibmJmIjoxNzQyMjgxNzUyLCJjc3JmIjoiZjU2N2UzYzMtOTRmYi00YWM5LTkyYWMtMmIxMDBiY2FjZjRlIn0.lzJt72Lsjlgdl2M0OUc1zwUXFIH4cGB9X1wBh5KB4Qk\ndefault_endpoint: servicex\n/home/gwatts/llms-test/test-wsl2-llm-HasygVzm/workspace\n"}],"internal_chat_message_metadata_passthrough":{"turn_id":"01a16b1f-0462-77e2-a1f3-5ed4cf10dde7","create_time":1792798564.6747503}},"metadata":{"client_authored":false,"fallback_token_limit_override":12000}}

