      -S uv run --script\n# NOTE: Be careful editing this block; requires-python and dependencies control uv/PEP 723 execution.\n# /// script\n# requires-python = \">=3.13\"\n# dependencies = [\n#   \"typer>=0.12\",\n# ]\n# ///\nimport logging\n\nimport typer\n\napp = typer.Typer(add_completion=False)\n\n\n@app.command()\ndef main(verbose: int = typer.Option(0, \"-v\", \"--verbose\", count=True)) -> None:\n    \"\"\"Describe what the script does.\"\"\"\n    log_level = logging.WARNING\n    if verbose == 1:\n        log_level = logging.INFO\n    elif verbose >= 2:\n        log_level = logging.DEBUG\n    logging.basicConfig(level=log_level, format=\"%(levelname)s: %(message)s\")\n    typer.echo(\"Hello from Typer.\")\n\n\nif __name__ == \"__main__\":\n    app()\n","exit_code":0,"duration":{"secs":0,"nanos":3323}},"started_at_ms":1792798122859,"completed_at_ms":1792798122859}}

