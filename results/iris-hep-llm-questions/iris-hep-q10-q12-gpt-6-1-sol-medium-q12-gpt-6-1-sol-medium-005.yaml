      the user wants a one-off executable script, automation tool, or runnable file that should declare dependencies inline and not live inside a package or project.\\n---\\n\\n# Standalone Script\\n\\n## Overview\\n\\nCreate a single-file Python script that runs via `uv run --script`, declares dependencies in a PEP 723 block, and uses Typer for a future-proof CLI.\\n\\n## Workflow\\n\\n1. Gather requirements: script purpose, inputs/outputs, dependencies, and any file paths.\\n2. Start from `assets/pep723_typer_script.py` and copy it into the target script.\\n3. Update the PEP 723 block:\\n   - Keep `requires-python = \\\">=3.13\\\"` as the default.\\n   - List all dependencies, always include `typer`.\\n4. Implement the logic inside the Typer command(s) and keep it single-file.\\n5. Ensure the shebang is the very first line: `#!/usr/bin/env -S uv run --script`.\\n6. Update the Typer command help string to describe what the script does.\\n7. Mark the script executable after writing it (e.g.,
      `chmod +x <script>`).\\n8. Provide run instructions (`uv run --script script.py`).\\n\\n## Requirements\\n\\n- Always use Typer even if no arguments are currently needed.\\n- Do not create a package layout or pyproject; keep everything in one script.\\n- Keep the file ASCII unless the user explicitly needs Unicode.\\n- Prefer small helper functions over complex classes unless necessary.\\n\\n## Assets\\n\\nUse `assets/pep723_typer_script.py` as the starting template for new scripts.\\n---\\nname: servicex\\ndescription: Write and debug ServiceX queries in func_adl against ATLAS xAOD data (PHYSLITE/PHYS), including dataset selection, filtering, hosted delivery, and local WSL2 reproduction of failing transforms. Use when asked to build, edit, or debug ServiceX/func_adl queries, ATLAS xAOD skims, rucio dataset fetches, or ServiceX Local runs.\\n---\\n\\n# ServiceX\\n\\n## Overview\\n\\nProvide concise, correct func_adl query patterns for ServiceX on ATLAS xAOD, with best practices for
      selections, outputs, and deliver usage.\\n\\n## Workflow\\n\\n1. Identify the dataset type and base query.\\n   - Use `FuncADLQueryPHYSLITE` for PHYSLITE or OpenData.\\n   - Use `FuncADLQueryPHYS` for PHYS or other derivations.\\n   - For an unfamiliar object property or missing method, follow\\n     `references/datamodel-xaod-discovery.md`: inspect the installed release-matched\\n     Python stubs first, then the corresponding Athena headers if needed.\\n2. Build a top-level `Select` that gathers all required collections and singletons.\\n   - Apply object-level filters with nested `.Where` inside this `Select`.\\n   - Do not pick columns yet.\\n3. Apply event-level filtering with a top-level `.Where` after the collections `Select`.\\n4. Create a final top-level `Select` that returns a single dictionary of output columns.\\n   - Convert units to standard LHC units (GeV, meters, etc.).\\n   - Never return a nested dictionary.\\n5. Use `deliver` once with `NFiles=1` by default and appropriate
      dataset source(s).\\n6. Make sure that the layout of the data that will be returned is remembered - downstream tasks that want to work with the data will need to understand it.\\n\\n## Core Rules\\n\\n- Prefer two top-level `Select` calls: collections first, output columns second.\\n- Filter objects with nested `.Where`; filter events with a top-level `.Where`.\\n- Use a single final `Select` that returns a dictionary of outputs.\\n- Do not use `awkward` functions inside ServiceX queries.\\n- Use `dataset.Rucio` for rucio DIDs and `dataset.FileList` for URL lists.\\n- Always set `NFiles=1` by default.\\n- For fetches where cache bypass matters, use `ignore_local_cache=True` in `deliver`.\\n- If a hosted transform fails and its worker logs are required, respond with\\n  `HELP USER`; for a local WSL2 run, inspect the generated `wsl_log.txt` as\\n  described in `references/servicex-local-wsl2.md`.\\n- Ensure `func_adl_servicex_xaodr25` is listed as a dependency in the active project and
      installed in the current virtual environment before running or generating code that uses it.\\n- The suffix on the xAOD package selects the ATLAS software release: `func_adl_servicex_xaodr25` is for Release 25 and `func_adl_servicex_xaodr21` is for Release 21. Match the query package to the ServiceX xAOD backend/executor release; do not mix an r25 query package with an r21 executor.\\n- When using xAOD tool helpers, add `hep-llm-helpers>=1.0.0b1` to the active project; standalone PEP 723 scripts must list it in their dependency block, and imports use `hep_llm_helpers.xaod_hints`.\\n- When defining an xAOD accessor, the Python variable assigned by `make_tool_accessor` must exactly match its `function_name` (for example, `tag_weight = make_tool_accessor(..., function_name=\\\"tag_weight\\\", ...)`); use that same name in the later query. A mismatch causes an unknown-type translation error.\\n- In standalone-script metadata, declare `jinja2` explicitly if the environment requires it for
      `func_adl_servicex_xaodr25` usage.\\n- When a hosted xAOD transform fails and its worker log is unavailable, use the\\n  local WSL2 procedure in `references/servicex-local-wsl2.md` before changing\\n  the query. Keep its generated code, logs, caches, downloaded files, and\\n  outputs outside the repository.\\n\\n## References\\n\\n- Load `references/servicex-hints.md` for overall ServiceX query patterns, synchronous delivery patterns, best practices, and error handling.\\n- Load `references/servicex-async-hints.md` only when async behavior is explicitly requested (`deliver_async`, async timeout handling, or version-compat async behavior).\\n- Load `references/servicex-local-wsl2.md` when reproducing a failing ATLAS\\n  PHYSLITE transform locally on Windows with `servicex-local` and WSL2.\\n- Load only the relevant xAOD data model topic file(s) to keep context small. Naming convention: `references/datamodel-xaod-*.md`.\\n- Load [xAOD accessor discovery](references/datamodel-xaod-discovery.md)
      for\\n  unfamiliar quantities, enum arguments, auxiliary attributes, or C++ methods\\n  absent from the Python stubs. It includes a small C++ callable pattern.\\n- xAOD topics:\\n  - `references/datamodel-xaod-units.md` (standard ATLAS units (energy, etc))\\n  - `references/datamodel-xaod-objects.md` (jets, electrons, muons)\\n  - `references/datamodel-xaod-tau.md`\\n  - `references/datamodel-xaod-missing-et.md`\\n  - `references/datamodel-xaod-tools-btagging.md`\\n  - `references/datamodel-xaod-triggers.md` (event decisions and a matching-format decision table; start here for trigger queries)\\n  - `references/datamodel-xaod-event-weights.md`\\n  - `references/datamodel-xaod-tlorentzvector.md`\\n\\nFor triggers, load only the recipe needed after choosing the operation:\\n\\n- Fired chain names: [name discovery](references/datamodel-xaod-trigger-names.md).\\n- Precomputed `TrigMatch_` / `AnalysisTrigMatch_` composites: [Run 2 matching](references/datamodel-xaod-trigger-matching-run2.md).\\n-
      `HLTNav_Summary_*` navigation: [Run 3 matching](references/datamodel-xaod-trigger-matching-run3.md).\\n- Data-trigger recommendations, GRLs, or prescales: [trigger selection](references/datamodel-xaod-trigger-selection.md).\\n---\\nname: awkward-array\\ndescription: Guidance for working with Awkward Array 2.0 jagged arrays and records in Python. Use when building or debugging `awkward` workflows, including record construction with `ak.zip`, adding fields with `ak.with_field`, filtering/aggregation, combinatorics (`ak.cartesian`/`ak.combinations`), `argmin`/`argmax` slicing, flattening, sorting, and NumPy interop or common Awkward pitfalls.\\n---\\n\\n# Awkward Array\\n\\n## Overview\\n\\nUse this skill to apply Awkward 2.0 best practices for jagged arrays, especially in HEP-style event data models. Keep guidance lean in this file and load reference notes only when needed.\\n\\n## Core workflow\\n\\n1. Build an event data model (records) with `ak.zip`.\\n2. Filter early at the event
      level.\\n3. Perform combinatorics or derived calculations.\\n4. Add derived fields back into the record with `ak.with_field`.\\n5. Repeat until the final values are present in the EDM.\\n\\n## Reference guide\\n\\nLoad only the reference files that matches the task:\\n\\n- `references/best-practices.md`: use when setting overall approach or reminding about Awkward 2.0 usage and axes.\\n- `references/records.md`: use when building records or adding fields.\\n- `references/filtering-aggregation.md`: use for boolean masking, `ak.sum`/`ak.count`/`ak.num`, and axis guidance.\\n- `references/sorting.md`: use for `ak.sort`.\\n- `references/combinatorics.md`: use for pairings or n-way combinations (`ak.cartesian`, `ak.combinations`).\\n- `references/argmin-argmax.md`: use when selecting min/max elements in jagged lists.\\n- `references/flattening.md`: use for `ak.flatten` behavior and axis rules.\\n- `references/numpy-interop.md`: use when mixing NumPy operations with Awkward arrays.\\n- `references/pitfalls.md`:
      use for common API mistakes and missing functions.\\n- `references/awkward-files.md`: use for file I/O patterns (read/write) with Awkward arrays.\\n\\n## Constraints\\n\\n- Use Awkward 2.0 APIs and syntax only.\\n- Avoid `axis=None` unless the function explicitly supports it.\\n- Ensure `awkward` is listed as a dependency in the active environment (venv plus `pyproject.toml` or `requirements.txt`).\\n---\\nname: vector-awkward\\ndescription: Use when working in Python with scikit-hep vector and Awkward Array to build vector records, register behaviors, compute deltaR or invariant masses, combine or boost vectors, or access vector properties from ak.zip records of type (Momentum3D/Momentum4D/Vector4D). Vector is only useful if you are also using Awkward.\\n---\\n\\n# Vector Awkward\\n\\n## Overview\\n\\nCreate Awkward Arrays that behave like vector objects and use vector methods without writing custom kinematic math. Use these steps to register behaviors, build records with the right
      field names, and perform common HEP operations like deltaR and invariant mass.\\n\\n## Quick Start\\n\\n1. Register vector behaviors once per session:\\n\\n```python\\nimport vector\\nvector.register_awkward()\\n```\\n\\n1. Build vector records with standard field names and a vector type name:\\n\\n```python\\nimport awkward as ak\\n\\nevents = ak.Array({\\n    \\\"electron\\\": ak.zip(\\n        {\\\"pt\\\": [50.0, 30.2], \\\"eta\\\": [1.4, -0.8], \\\"phi\\\": [2.1, 0.5], \\\"mass\\\": [0.0005, 0.0005]},\\n        with_name=\\\"Momentum4D\\\",\\n    )\\n})\\n```\\n\\n## Build Vector Records\\n\\n- Use `ak.zip(..., with_name=\\\"Momentum3D\\\")` for 3D operations like deltaR.\\n- Use `ak.zip(..., with_name=\\\"Momentum4D\\\")` for 4D operations like invariant mass or boosts.\\n- Prefer standard names like `pt/eta/phi/mass` or `px/py/pz/E` so vector can infer coordinate systems.\\n- Call `vector.register_awkward()` before accessing vector properties or methods.\\n\\n## Access Vector
      Properties\\n\\n```python\\nparticles = ak.zip({\\\"px\\\": px, \\\"py\\\": py, \\\"pz\\\": pz, \\\"E\\\": E}, with_name=\\\"Vector4D\\\")\\nparticles.pt\\nparticles.phi\\nparticles.eta\\nparticles.mass\\n```\\n\\n## Common Operations\\n\\nCalculate deltaR between two collections:\\n\\n```python\\npairs = ak.cartesian([events.electron, events.muon])\\nelectrons, muons = ak.unzip(pairs)\\ndR = electrons.deltaR(muons)\\n```\\n\\nCombine 4-vectors and compute invariant mass:\\n\\n```python\\nfirst_e, second_e = ak.unzip(ak.combinations(events.electron, 2))\\ninv_mass = (first_e + second_e).mass\\n```\\n\\nBoost to a parent rest frame:\\n\\n```python\\nparent = particle1 + particle2\\nparticle1_rf = particle1.boostCM_of_p4(parent)\\n```\\n\\n## Reference Material\\n\\nLoad `references/vector-hints.md` for more examples, method notes, and advanced snippets.\\n---\\nname: hist\\ndescription: Use when working with the scikit-hep hist library in Python to create, fill, slice, and plot histograms
      (1D/2D/multi-axis), including UHI indexing, categorical axes, and mplhep plotting conventions.\\n---\\n\\n# Hist\\n\\n## Overview\\n\\nUse this skill to build and manipulate hist.Hist objects, choose axis/storage types, fill with data and weights, and produce publication-style plots with mplhep styles, all based on matplotlib.\\n\\n## Quick start\\n\\n- Create histograms with `Hist.new` plus axis builders (`Reg`, `Var`, `StrCat`) and finish with exactly one storage (`Int64` or `Weight`).\\n- Make sure axis labels contain a short variable name and units. Histogram titles should contains a slightly longer concise description of what data went into the plot.\\n- Fill with `.fill(...)` using axis names; note that `.fill` returns `None`.\\n- Slice or project with UHI indexing (e.g., `h.project(\\\"x\\\")` or `h[{\\\"x\\\": 5j}]`).\\n- Plot with `hist.plot(...)` or `mplhep.hist2dplot(...)`; use `plt.style.use(hep.style.ATLAS)` for HEP-style plots.\\n\\n## Core tasks\\n\\n### Create axes
      and storage\\n\\n- Use `Reg` for uniform bins and `Var` for variable-width bins.\\n- Use `StrCat` for categorical axes; set `growth=True` for auto-added categories.\\n- Choose storage: `Int64` for unweighted counts, `Weight` for weighted fills.\\n\\n### Fill and access contents\\n\\n- Fill with named axes (e.g., `h.fill(x=..., y=..., weight=...)`).\\n- Read counts with `h.view()` and errors from `np.sqrt(h.variances())`.\\n\\n### Slice, rebin, and project\\n\\n- Use UHI slicing (complex numbers for bin selection, `::2j` for rebinning).\\n- Project with `h.project(\\\"axis_name\\\")` for 1D plots.\\n\\n### Plot and save\\n\\n- Use `hist.plot(histtype=\\\"fill\\\")` for 1D; use `mplhep.hist2dplot` for 2D.\\n- Use `plt.subplots()` without custom `figsize` unless explicitly requested.\\n- Save with `fig.savefig(\\\"name.png\\\")` and close with `plt.close(fig)`.\\n\\n## References\\n\\n- Use `references/hist-hints.md` for concrete code snippets and common patterns.\\n- Use `references/hist-advanced.md`
      for UHI indexing, plotting gotchas, and label/LaTeX guidance.\\n- Use `references/lhc-hist-ranges.md` for starting suggestions on histogram axis ranges and binning.\\n\"}}\n[{\"name\":\"image_gen__imagegen\",\"description\":\"Tools in the image_gen namespace.\\n\\nThe `image_gen.imagegen` tool enables image generation from descriptions and editing of existing images based on specific instructions. Use it when:\\n\\n- The user requests an image based on a scene description, such as a diagram, portrait, comic, meme, or any other visual.\\n- The user wants to modify an attached or previously generated image with specific changes, including adding or removing elements, altering colors, improving quality/resolution, or transforming the style (e.g., cartoon, oil painting).\\n\\nGuidelines:\\n- imagegen needs a few minutes to finish. In code-mode, use the first-line @exec directive to give the initial call 120 seconds and the same yield for any waits that follow. Once it finishes, return
      the image with generatedImage(result).\\n- Avoid printing the full result or its base64 image data with `text()` or `notify()`; print only small metadata when needed.\\n- Set `transparent_background` to true when the request calls for a transparent background, including background removal or a cutout; set it to false otherwise. For edits, preserve existing transparency unless the user asks to change it.\\n- Omit both `referenced_image_paths` and `num_last_images_to_include` when generating a brand new image.\\n- For edits, use `referenced_image_paths` when every target image has a local file path.\\n- If you have not seen a local image yet, use `view_image` to inspect it before editing.\\n- Use `num_last_images_to_include` only when at least one target image has no local file path.\\n- Set `num_last_images_to_include` to the smallest number of recent conversation images that includes every target image, up to 5.\\n- Never provide both `referenced_image_paths` and `num_last_images_to_include`.\\n-
      If neither mechanism can include every target image, ask the user to attach the missing images again.\\n- Directly generate the image without reconfirmation or clarification unless required images must be attached again.\\n- Always use this tool for image editing unless the user explicitly requests otherwise. Do not use the `python` tool for image editing unless specifically instructed.\\n\\n\\nexec tool declaration:\\n```ts\\ndeclare const tools: { image_gen__imagegen(args: {\\n  num_last_images_to_include?: number | null;\\n  prompt: string;\\n  referenced_image_paths?: Array<string> | null;\\n  // Whether the output should have a transparent background. Defaults to false.\\n  transparent_background?: boolean;\\n}): Promise<unknown>; };\\n```\"},{\"name\":\"mcp__codex_apps__search_service_web_run\",\"description\":\"Tool for accessing the internet.\\n\\n\\n---\\n\\n## Examples of different commands available in this tool\\n\\nExamples of different commands available in this tool:\\n*
      `system2_search_query`: {\\\"system2_search_query\\\": [{\\\"q\\\": \\\"What is the capital of France?\\\"}, {\\\"q\\\": \\\"What is the capital of belgium?\\\"}]}. Searches the internet for a given query (and optionally with a domain or recency filter)\\n* `image_query`: {\\\"image_query\\\":[{\\\"q\\\": \\\"waterfalls\\\"}]}.\\n* `open`: {\\\"open\\\": [{\\\"ref_id\\\": \\\"turn0search0\\\"}, {\\\"ref_id\\\": \\\"https://www.openai.com\\\", \\\"lineno\\\": 120}]}\\n* `click`: {\\\"click\\\": [{\\\"ref_id\\\": \\\"turn0fetch3\\\", \\\"id\\\": 17}]}\\n* `find`: {\\\"find\\\": [{\\\"ref_id\\\": \\\"turn0fetch3\\\", \\\"pattern\\\": \\\"Annie Case\\\"}]}\\n* `screenshot`: {\\\"screenshot\\\": [{\\\"ref_id\\\": \\\"turn1view0\\\", \\\"pageno\\\": 0}, {\\\"ref_id\\\": \\\"turn1view0\\\", \\\"pageno\\\": 3}]}\\n* `time`: {\\\"time\\\":[{\\\"utc_offset\\\":\\\"+03:00\\\"}]}\\n\\n---\\n\\n## Usage hints\\nTo use this tool efficiently:\\n* Use multiple commands and queries in one call to get
      more results faster; e.g. {\\\"system2_search_query\\\": [{\\\"q\\\": \\\"bitcoin news\\\"}], \\\"find\\\": [{\\\"ref_id\\\": \\\"turn0search0\\\", \\\"pattern\\\": \\\"Annie Case\\\"}, {\\\"ref_id\\\": \\\"turn0search1\\\", \\\"pattern\\\": \\\"John Smith\\\"}]}\\n* Use \\\"response_length\\\" to control the number of results returned by this tool, omit it if you intend to pass \\\"short\\\" in\\n* Only write required parameters; do not write empty lists or nulls where they could be omitted.\\n* `system2_search_query` must have length at most 4 in each call. If it has length > 3, response_length must be medium or long\\n* If you find yourself in a situation where you accidentally call the `web_run` tool, it''s best just to send an empty query: {\\\"system2_search_query\\\": [{\\\"q\\\": \\\"\\\"}]}.\\n\\n\\n\\n---\\n\\n## Decision boundary\\n\\nIf the user makes an explicit request to search the internet, find latest information, look up, etc (or to not do so), you must obey their
      request.\\nWhen you make an assumption, always consider whether it is temporally stable; i.e. whether there''s even a small (>10%) chance it has changed. If it is unstable, you must verify with browsing the internet for verification.\\n\\n<situations_where_you_must_browse_the_internet>\\nBelow is a list of scenarios where browsing the internet MUST be used. PAY CLOSE ATTENTION: you MUST browse the internet in these cases. If you''re unsure or on the fence, you MUST bias towards browsing the internet.\\n- The information could have changed recently: for example news; prices; laws; schedules; product specs; sports scores; economic indicators; political/public/company figures (e.g. the question relates to ''the president of country A'' or ''the CEO of company B'', which might change over time); rules; regulations; standards; software libraries that could be updated; exchange rates; recommendations (i.e., recommendations about various topics or things might be informed by what currently
      exists / is popular / is safe / is unsafe / is in the zeitgeist / etc.);…33915 tokens truncated…xact, direct lookup — prefer this when known; it''s faster and unambiguous.\\n\\tlist_title (Optional[str]): The title of the list to read. Resolved via a fuzzy, relevance-ranked search (not an exact, case-sensitive match) — so it can be slower and less precise than list_id, may match several similarly-named lists, and may return a related list rather than an exact title match; the best match is used. Pass list_id to target a specific list among several with similar titles. If nothing matches, returns list_not_found.\\n\\tformat (Optional[str]): Output format - ''markdown'' (default) or ''csv''\\n\\tlimit (Optional[int]): Maximum number of records to return per page. Capped at 100 — larger values are clamped to 100, so reading more than 100 records requires paginating with cursor. Default: 100\\n\\tcursor (Optional[str]): Pagination cursor for fetching the next page of a multi-page read.
      Pass back the exact next_cursor string from a previous call''s output — it is an opaque token, so do not construct, parse, or modify it. Omit (or pass empty) to read from the first record.\\n\\tschema_only (Optional[bool]): When true, return only the column schema (names and types) and skip fetching records. Use this to answer \\\"what columns does this list have?\\\" without reading any rows. Default: false\\n\\nReturns:\\n\\tstr: List contents formatted as a markdown table or CSV data. When more records remain, the output includes a next_cursor to pass back in for the following page.\\n\\nExamples:\\n\\t- \\\"Read a list\\\" -> slack_read_list(list_id=''F0ABC123'')\\n\\t- \\\"Read a list by name\\\" -> slack_read_list(list_title=''Project Tracker'')\\n\\t- \\\"What columns does this list have?\\\" -> slack_read_list(list_id=''F0ABC123'', schema_only=true)\\n\\t- \\\"Export list as CSV\\\" -> slack_read_list(list_id=''F0ABC123'', format=''csv'')\\n\\t- \\\"Get first 10 rows\\\" ->
      slack_read_list(list_id=''F0ABC123'', limit=10)\\n\\t- \\\"Get the next page\\\" -> slack_read_list(list_id=''F0ABC123'', cursor=''<next_cursor from prior call>'')\\n\\nError Handling:\\n\\t- Returns error if neither list_id nor list_title is provided, or the list is not found\\n\\t- Returns error if user lacks access to the list\\n\\t- When list_title matches multiple lists, the best search match is read (no error); pass list_id to disambiguate\\n\\t- Returns \\\"invalid_cursor\\\" if the pagination cursor is malformed\\n\\t- Returns \\\"rate_limit_exceeded\\\" when too many reads are issued in a short window — back off, then retry\\n\\t- Returns \\\"feature_not_enabled\\\" if Slack lists are not available to this account — do not retry\\n\\t- Returns \\\"failure_fetching_records\\\" if the list could be read but came back malformed — retrying once is reasonable; treat a second occurrence as terminal\\n\\t- Other errors from the underlying record read surface as-is, e.g. \\\"missing_scope\\\"
