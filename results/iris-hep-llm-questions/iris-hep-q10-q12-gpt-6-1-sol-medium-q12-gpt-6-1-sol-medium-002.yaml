      behavior and axis rules.\\n- `references/numpy-interop.md`: use when mixing NumPy operations with Awkward arrays.\\n- `references/pitfalls.md`: use for common API mistakes and missing functions.\\n- `references/awkward-files.md`: use for file I/O patterns (read/write) with Awkward arrays.\\n\\n## Constraints\\n\\n- Use Awkward 2.0 APIs and syntax only.\\n- Avoid `axis=None` unless the function explicitly supports it.\\n- Ensure `awkward` is listed as a dependency in the active environment (venv plus `pyproject.toml` or `requirements.txt`).\\n\"}\n{\"chunk_id\":\"87edd3\",\"wall_time_seconds\":0.000004204,\"exit_code\":0,\"original_token_count\":557,\"output\":\"---\\nname: vector-awkward\\ndescription: Use when working in Python with scikit-hep vector and Awkward Array to build vector records, register behaviors, compute deltaR or invariant masses, combine or boost vectors, or access vector properties from ak.zip records of type (Momentum3D/Momentum4D/Vector4D). Vector is only useful
      if you are also using Awkward.\\n---\\n\\n# Vector Awkward\\n\\n## Overview\\n\\nCreate Awkward Arrays that behave like vector objects and use vector methods without writing custom kinematic math. Use these steps to register behaviors, build records with the right field names, and perform common HEP operations like deltaR and invariant mass.\\n\\n## Quick Start\\n\\n1. Register vector behaviors once per session:\\n\\n```python\\nimport vector\\nvector.register_awkward()\\n```\\n\\n1. Build vector records with standard field names and a vector type name:\\n\\n```python\\nimport awkward as ak\\n\\nevents = ak.Array({\\n    \\\"electron\\\": ak.zip(\\n        {\\\"pt\\\": [50.0, 30.2], \\\"eta\\\": [1.4, -0.8], \\\"phi\\\": [2.1, 0.5], \\\"mass\\\": [0.0005, 0.0005]},\\n        with_name=\\\"Momentum4D\\\",\\n    )\\n})\\n```\\n\\n## Build Vector Records\\n\\n- Use `ak.zip(..., with_name=\\\"Momentum3D\\\")` for 3D operations like deltaR.\\n- Use `ak.zip(..., with_name=\\\"Momentum4D\\\")`
      for 4D operations like invariant mass or boosts.\\n- Prefer standard names like `pt/eta/phi/mass` or `px/py/pz/E` so vector can infer coordinate systems.\\n- Call `vector.register_awkward()` before accessing vector properties or methods.\\n\\n## Access Vector Properties\\n\\n```python\\nparticles = ak.zip({\\\"px\\\": px, \\\"py\\\": py, \\\"pz\\\": pz, \\\"E\\\": E}, with_name=\\\"Vector4D\\\")\\nparticles.pt\\nparticles.phi\\nparticles.eta\\nparticles.mass\\n```\\n\\n## Common Operations\\n\\nCalculate deltaR between two collections:\\n\\n```python\\npairs = ak.cartesian([events.electron, events.muon])\\nelectrons, muons = ak.unzip(pairs)\\ndR = electrons.deltaR(muons)\\n```\\n\\nCombine 4-vectors and compute invariant mass:\\n\\n```python\\nfirst_e, second_e = ak.unzip(ak.combinations(events.electron, 2))\\ninv_mass = (first_e + second_e).mass\\n```\\n\\nBoost to a parent rest frame:\\n\\n```python\\nparent = particle1 + particle2\\nparticle1_rf = particle1.boostCM_of_p4(parent)\\n```\\n\\n##
      Reference Material\\n\\nLoad `references/vector-hints.md` for more examples, method notes, and advanced snippets.\\n\"}\n{\"chunk_id\":\"d36260\",\"wall_time_seconds\":0.00000338,\"exit_code\":0,\"original_token_count\":547,\"output\":\"---\\nname: hist\\ndescription: Use when working with the scikit-hep hist library in Python to create, fill, slice, and plot histograms (1D/2D/multi-axis), including UHI indexing, categorical axes, and mplhep plotting conventions.\\n---\\n\\n# Hist\\n\\n## Overview\\n\\nUse this skill to build and manipulate hist.Hist objects, choose axis/storage types, fill with data and weights, and produce publication-style plots with mplhep styles, all based on matplotlib.\\n\\n## Quick start\\n\\n- Create histograms with `Hist.new` plus axis builders (`Reg`, `Var`, `StrCat`) and finish with exactly one storage (`Int64` or `Weight`).\\n- Make sure axis labels contain a short variable name and units. Histogram titles should contains a slightly longer concise description
      of what data went into the plot.\\n- Fill with `.fill(...)` using axis names; note that `.fill` returns `None`.\\n- Slice or project with UHI indexing (e.g., `h.project(\\\"x\\\")` or `h[{\\\"x\\\": 5j}]`).\\n- Plot with `hist.plot(...)` or `mplhep.hist2dplot(...)`; use `plt.style.use(hep.style.ATLAS)` for HEP-style plots.\\n\\n## Core tasks\\n\\n### Create axes and storage\\n\\n- Use `Reg` for uniform bins and `Var` for variable-width bins.\\n- Use `StrCat` for categorical axes; set `growth=True` for auto-added categories.\\n- Choose storage: `Int64` for unweighted counts, `Weight` for weighted fills.\\n\\n### Fill and access contents\\n\\n- Fill with named axes (e.g., `h.fill(x=..., y=..., weight=...)`).\\n- Read counts with `h.view()` and errors from `np.sqrt(h.variances())`.\\n\\n### Slice, rebin, and project\\n\\n- Use UHI slicing (complex numbers for bin selection, `::2j` for rebinning).\\n- Project with `h.project(\\\"axis_name\\\")` for 1D plots.\\n\\n### Plot and save\\n\\n-
      Use `hist.plot(histtype=\\\"fill\\\")` for 1D; use `mplhep.hist2dplot` for 2D.\\n- Use `plt.subplots()` without custom `figsize` unless explicitly requested.\\n- Save with `fig.savefig(\\\"name.png\\\")` and close with `plt.close(fig)`.\\n\\n## References\\n\\n- Use `references/hist-hints.md` for concrete code snippets and common patterns.\\n- Use `references/hist-advanced.md` for UHI indexing, plotting gotchas, and label/LaTeX guidance.\\n- Use `references/lhc-hist-ranges.md` for starting suggestions on histogram axis ranges and binning.\\n\"}\n[{\"name\":\"image_gen__imagegen\",\"description\":\"Tools in the image_gen namespace.\\n\\nThe `image_gen.imagegen` tool enables image generation from descriptions and editing of existing images based on specific instructions. Use it when:\\n\\n- The user requests an image based on a scene description, such as a diagram, portrait, comic, meme, or any other visual.\\n- The user wants to modify an attached or previously generated image with
