      servicex import Sample, ServiceXSpec, dataset, deliver\nfrom servicex_analysis_utils import to_awk\n\n\napp = typer.Typer(add_completion=False)\n\nDATASET_DID = (\n    \"opendata:mc20_13TeV.410471.PhPy8EG_A14_ttbar_hdamp258p75_allhad.\"\n    \"deriv.DAOD_PHYSLITE.e6337_s3681_r13167_p6026\"\n)\nFILE_DID = \"mc20_13TeV:DAOD_PHYSLITE.37861619._000001.pool.root.1\"\nSAMPLE_NAME = \"electron_pt\"\n\n\ndef make_query(max_events: int):\n    \"\"\"Select events with >=1 electron above threshold, and return their pT values.\"\"\"\n    base_query = FuncADLQueryPHYSLITE()\n    return (\n        base_query\n        .Take(max_events)\n        .Where(\n            lambda event: event.Electrons()\n            .Where(lambda electron: electron.pt() / 1000.0 > 25.0)\n            .Count()\n            > 0\n        )\n        .Select(\n            lambda event: {\n                \"electron_pt\": event.Electrons()\n                .Where(lambda electron: electron.pt() / 1000.0 > 25.0)\n                .Select(lambda
      electron: electron.pt() / 1000.0)\n            }\n        )\n    )\n\n\n@app.command()\ndef main(\n    max_events: int = typer.Option(20_000, \"--max-events\", min=1),\n    output_dir: Path = typer.Option(Path(\".\"), \"--output-dir\"),\n) -> None:\n    \"\"\"Fetch one PHYSLITE file and plot electron pT above 25 GeV.\"\"\"\n    if max_events < 1:\n        raise typer.BadParameter(\"must be at least 1\", param_hint=\"--max-events\")\n\n    query = make_query(max_events)\n    delivered = deliver(\n        ServiceXSpec(\n            Sample=[\n                Sample(\n                    Name=SAMPLE_NAME,\n                    Dataset=dataset.Rucio(FILE_DID),\n                    NFiles=1,\n                    Query=query,\n                )\n            ]\n        )\n    )\n\n    event_data = to_awk(delivered)[SAMPLE_NAME]\n    raw_pts = ak.to_list(ak.flatten(event_data[\"electron_pt\"], axis=None))\n    raw_pts = [float(value) for value in raw_pts]\n    selected_event_count = len(event_data)\n    if
      selected_event_count == 0 or not raw_pts:\n        raise RuntimeError(\n            f\"No selected electrons found in the first {max_events} events of {FILE_DID}\"\n        )\n\n    output_dir.mkdir(parents=True, exist_ok=True)\n    plot_path = output_dir / \"plot_1.png\"\n    fig, ax = plt.subplots(figsize=(8, 6))\n    ax.hist(raw_pts, bins=50, range=(25, max(100, math.ceil(max(raw_pts)))),\n            histtype=\"stepfilled\", color=\"steelblue\", alpha=0.8)\n    ax.set_xlabel(r\"Electron transverse momentum $p_T$ [GeV]\")\n    ax.set_ylabel(\"Electrons\")\n    ax.set_title(\"Electrons with $p_T > 25$ GeV\")\n    fig.tight_layout()\n    fig.savefig(plot_path, dpi=150)\n    plt.close(fig)\n\n    mean_pt = math.fsum(raw_pts) / len(raw_pts)\n    avg_entries_per_event = len(raw_pts) / selected_event_count\n    print(\n        f\"METRIC: avg_entries_per_event={avg_entries_per_event:.12g} \"\n        f\"mean={mean_pt:.12g}\",\n        flush=True,\n    )\n\n\nif __name__ == \"__main__\":\n    app()\n"}},"status":"completed","stdout":"Success.
      Updated the following files:\nA /home/gwatts/llms-test/test-wsl2-llm-kORklaAc/workspace/script.py\n","stderr":""},"started_at_ms":1792798698988,"completed_at_ms":1792798699014}}

