# Template-driven WSL2 Codex batch configuration
prompt_template: |
  Do your best to answer the following questions. Use skills (like the atlas-sf and AnalysisBase) to help.

  {{ question }}

  Please also add to your final report a list of the skills and the MCP tools you used/called.

questions:
  - id: q0-skills
    question: "Print out the list of /skills in the status."
  - id: q1-jz-cuts
    question: |
      Please tell me what the leading jet cuts are for the qcd dijet JZ samples 
      (please list the Run 3 DSID's for each one).
  - id: q2-find-datasets
    question: |
      Please find the official Run 3 jz2 dijet PHYSLITE datasets.
      This should be the base-line data sets. Please also list the MC campaigns for each of them (and what they represent).
  - id: q3-sx-jz-plot
    question: |
      Please make the following histograms from 100 files of the current Run 3 JZ dijet MC dataset
      (use JZ2 slice): jet pt, eta, and number of jets. For the first two, please overlay three
      histograms - one for the leading jet (pt), the second leading, and the third leading.

      All this will be done on the UChicago AF (use the uchicago-af mcp server), and use the
      IRIS-HEP ServiceX, awkward array, etc, skills for the workflow. The notebook should be written
      as a "narrative", with plots and code inline so the user can read it and understand what is
      going on.

      Please run on a single file before running on all requested files so as not to waste resources.
      The final notebook should not show this smoke test - just the final run of 100. And parameterize
      the notebook in a cell with `n_files=100` that one can change later to run on more (or less) files.

      When finished, please copy a notebook converted to markdown (with images inline put
      inline - check this is done properly, it easy to add base64 that is a mess) back
      and call it "result.md". If you have to spin up a Jupyter server (if one isn't already running)
      make sure to use an image with the `latest` tag, otherwise mcp access won't work. Make sure to
      copy over the servicex.yaml file in the base directory to the jupyter server. Always test out the
      code/notebook on a single data file before running on everything.

      In the final status, please report:
        * Data set name, along with PMG tag info, number of files, and what MC campaign it is associated with.
        * What MCP tools you used
        * What skills you used.
    copy_back:
      - "result.md"
  - id: q4-ab-jets
    question: |
      Please make the following histograms from 100 files of the current Run 3 JZ dijet MC dataset
      (use JZ2 slice): jet pt, eta, and number of jets. For the first two, please overlay three
      histograms - one for the leading jet (pt), the second leading, and the third leading.

      Do this using the following work following:
        1. Use analysis base to dump the required information.
          * Run this as a set of jobs on htcondor.
          * Write the data to /data/gwatts/xxx (some unique directory).
        2. Create a jupyter notebook that will load the files, and make the plots.
          * Use the jupyterlab server.
          * If you have to start up a kernel, use the `latest` version of the ml kernel
        3. Convert the final notebook to markdown
          * Inline the images in the markdown so only one file has to come back.
          * Double check the formatting of the inline - it is easy to get that wrong.
        4. Copy the file back as `results.md`.
    copy_back:
      - "result.md"
model: gpt-5.6-luna:high
marketplaces:
  - https://github.com/usatlas/marketplace.git
  - https://github.com/gordonwatts/atlas-analysisbase-marketplace.git
plugins:
  - af-uchicago@usatlas-marketplace
  - atlas-analysisbase@atlas-analysisbase-marketplace
mcp_servers:
  - atlas-af
copy_files: []
copy_back: []
output: .\results\uchicago-mcp\umcp
distro: Ubuntu
wsl_parent: /home/gwatts/llm-testing
timeout_seconds: 14400
