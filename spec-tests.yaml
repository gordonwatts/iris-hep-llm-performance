# yaml-language-server: $schema=test-wsl2-llm-template.schema.json
# Template-driven WSL2 Codex batch configuration
prompt_template: |
  {{ question }}

questions:
  - id: spec-from-old-analysis-modified
    question: |
      Use the $iris-hep:analysis-spec-builder skill, please read this old Run 1 analysis 
      pdf. I want to build a analysis specification that is follows this analysis, except
      (!!) the background method for QCD - lets use the ABCD method, because the one used
      in this analysis failed. Output the file in specification.md
    copy_files:
      - .\spec\1501.04020v2.pdf
    copy_back:
      - specification.md
  - id: datasets-from-spec
    question: |
      Use the $atlas-analysis:analysis-data-sources skill to determine the data
      tiers and individual field/accessor requirements for the analysis described
      in calratio-abcd-spec.md. Implement this Run 1 analysis as a Run 3 analysis,
      preserving the ABCD background method and explicitly recording migration
      choices and unresolved inputs.

      Write data-sources.md and data-source-evidence.json in the workspace root.

    copy_files:
      - .\spec\calratio-abcd-spec.md
      - ~\servicex.yaml
    copy_back:
      - data-sources.md
      - data-source-evidence.json
  - id: dataset-ids-from-data-sources
    question: |
      Use the $atlas-analysis:find-atlas-datasets skill to select the complete
      datasets for calratio-abcd-spec.md, implemented as a Run 3 analysis with
      ABCD QCD estimation. Read data-sources.md and data-source-evidence.json
      from the preceding data-source mapping step as the tier and individual
      leaf/accessor contract. Preserve its evidence scope, backups and gaps.
      Where a tier is only proposed, search for catalog-confirmed candidates at
      that tier and mark their analysis compatibility provisional. An unverified
      accessor must not be reported as verified or prevent independent DID lookup.

      Resolve analysis-ready, complete Rucio scope:name identifiers, including
      production tags, for the required data, Standard Model backgrounds,
      signal points and special streams. Use the applicable official central
      recommendation page's declared default samples for Standard Model
      backgrounds when available. Cite that recommendation and verify the
      actual requested derivation in the catalogs; bare DSIDs, wildcards and
      EVNT-only identifiers are not the requested result. Record unavailable
      recommendations, missing samples and tier/field incompatibilities as gaps.
      Preserve data-driven control/sideband roles and avoid duplicate coverage.

      First classify sample roles as required, conditional or alternative using
      the specification. The electroweak/top contamination audit is conditional;
      do not expand inactive audit families into required datasets. Multijet MC
      is for detector/performance validation, not the ABCD QCD normalization.
      Separate physical event sources from selections on a shared parent and
      external metadata. Derive this plan from the specification if the older
      ledger lacks it. State assumed years and campaign mapping without treating
      all available years as an approved analysis scope.

      Write datasets.md with a compact role-to-source plan, a required-source
      table of complete scope:name DIDs, conditional options, classified gaps,
      and rejected candidates. Use the skill's table columns and evidence rules.
      Keep each DID once and reference shared sources from multiple roles. Keep
      all required slices and the 13 exact signal mass pairs; do not replace
      completeness with a representative smoke sample. Empty containers cannot
      count as selected inputs. Classify apparent duplicates by exact identity,
      container/member overlap, alternative production, campaign, and generator
      slice/decay rather than deleting similar names indiscriminately.

      For each missing role explain whether it could be a selection of a known
      source, needs retention/provenance checks, lacks a derivation or physics
      production, is external metadata, or awaits an optional scope decision.
      Do not assume empty/unpaired/random-trigger controls are skims of Main.
      Consolidate unknown-year blockers instead of multiplying assumed periods.
      Reconcile every input role and requirement ID to sources or explicit gaps.
      Store shared evidence once; do not repeat full metadata or accessor prose.
      Do not claim complete coverage or verified accessors without evidence.
    # Stage the preceding run's two outputs here; see spec/README.md.
    # Questions run in isolated workspaces, so YAML order does not pass files.
    copy_files:
      - .\spec\calratio-abcd-spec.md
      - .\spec\data-sources.md
      - .\spec\data-source-evidence.json
    copy_back:
      - datasets.md
model: gpt-6.1-sol:medium
marketplaces:
  - https://github.com/iris-hep/marketplace.git@spec-updates
  - https://github.com/usatlas/marketplace.git
  - https://github.com/gordonwatts/atlas-analysisbase-marketplace.git@codex/analysis-dataset-manifest
plugins:
  - iris-hep@iris-hep-tools
  - atlas-analysis@atlas-analysis-marketplace
  - af-uchicago@usatlas-marketplace
  - atlas@usatlas-marketplace
mcp_servers:
  - atlas-af
distro: Ubuntu
max_copy_back_files: 100
timeout_seconds: 1800
output: .\results\spec-tests\sc
