# Template-driven WSL2 Codex batch configuration
prompt_template: |
  Using the atlas-analysisbase skill, please build from scratch an AnalysisBase config file
  and any required components so that it can accomplish the following:

  {{ question }}

  The output root-tuple file should be called `run/ab-output.root``. Report back the size of the
  file (in bytes). The analysisbase configuration file should be `source/ab-config.yaml``. Finally, create
  a bash script called `source/ab-run.sh` that runs everything, including doing the `asetup` command.`

  Time how long it takes to run the analysis base image. `bash` built in `time` command works well for this.

  List at the end of the prompt three things that should have been included in the skill
  that would have doing this work faster and cost less tokens. Modify the original skill files
  to fix these three problems, and generate a diff file leaving it `run/improvements.diff`.

  Note that running the analysis-base image can take a great deal of time depending on
  network connectivity - allow upwards of 20 minutes (or even longer).
questions:
  - id: q1-jet-kinematics
    question: |
      Run on 100 events from the tutorial physlite file and dump out only the jet pt, eta, and phi.
  - id: q2-sys-names
    question: |
      List the full list of systematics that are run on PHYSLITE.
  - id: q3-ele-sys-kinematics
    question: |
      Run on 100 events from the tutorial physlite file and dump out only the electron pt, eta, and phi.
      Run the full systematics for electrons so the output file contains all ele related systematic variations
      of pt, eta, and phi.
model: gpt-5.6-luna:high
marketplaces:
  - https://github.com/gordonwatts/atlas-analysisbase-marketplace.git
plugins:
  - atlas-analysisbase@atlas-analysisbase-marketplace
copy_files: []
copy_back:
  - run/ab-output.root
  - source/ab-config.yaml
  - source/ab-run.sh
output: .\results\analyiss-base-questions\ab
repeat: 1
threads: 1
distro: atlas_al9
